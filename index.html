<style>
/* Layout: boarding-pass header, sticky step rail on the left, one step panel on the right. */
:root{
  --bg:#EDF0F4; --panel:#FAFBFD; --ink:#0E1A2B; --mute:#53637B; --line:#CBD3DF;
  --acc:#1D4FA8; --acc-ink:#FFFFFF; --soft:#E1E8F4; --stamp:#B3202F; --ok:#1E7A4F; --warn:#9A5B00;
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-b:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A111E; --panel:#111B2D; --ink:#E6ECF5; --mute:#9BAAC2; --line:#26344C;
    --acc:#7FAAFF; --acc-ink:#0A111E; --soft:#17253D; --stamp:#FF7A86; --ok:#5FD39B; --warn:#F2B35E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111E; --panel:#111B2D; --ink:#E6ECF5; --mute:#9BAAC2; --line:#26344C;
  --acc:#7FAAFF; --acc-ink:#0A111E; --soft:#17253D; --stamp:#FF7A86; --ok:#5FD39B; --warn:#F2B35E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.7rem;letter-spacing:-.01em}
h3{font-size:1.15rem}
h4{font-family:var(--font-m);font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:500;margin:18px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.mono{font-family:var(--font-m)}
.sm{font-size:.82rem;color:var(--mute)}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--font-d);font-size:1.6rem;letter-spacing:-.02em}
.brand span{font-family:var(--font-m);font-size:.78rem;color:var(--mute)}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{font:500 .8rem var(--font-m);padding:6px 12px;background:transparent;color:var(--mute);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.notice{margin:16px 0 22px;display:grid;gap:6px;border:1px dashed var(--stamp);border-radius:6px;padding:12px 14px;font-size:.88rem}
.notice strong{font-family:var(--font-m);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--stamp)}
.notice span{max-width:90ch}
.shell{display:grid;grid-template-columns:190px minmax(0,1fr);gap:32px;align-items:start}
nav.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:10px;align-items:baseline;text-align:left;background:transparent;border:0;border-left:2px solid var(--line);padding:9px 10px;color:var(--mute);font:500 .95rem var(--font-b);cursor:pointer}
.step i{font:500 .75rem var(--font-m);font-style:normal}
.step[aria-current="step"]{border-left-color:var(--acc);color:var(--ink);background:var(--soft)}
.step:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
section.panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px;min-width:0}
section.panel.on{display:block}
.intro{color:var(--mute);margin:8px 0 18px}
.grp{margin:22px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px;margin-top:8px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld span{font-size:.82rem;font-weight:600}
.fld small{color:var(--mute);font-size:.76rem}
select,input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.chk input{margin-top:4px;accent-color:var(--acc)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.btn{font:600 .9rem var(--font-b);padding:10px 16px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc)}
.sample{font-size:.8rem;color:var(--mute);margin-top:6px}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;background:var(--soft);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.sum .mono{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.sum strong{font-family:var(--font-d);font-size:1.2rem}
.sum .big{font-family:var(--font-d);font-size:1.9rem;font-weight:700;color:var(--acc)}
details.path{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--bg)}
details.path>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 14px}
details.path>summary::-webkit-details-marker{display:none}
.code{font:500 .78rem var(--font-m);background:var(--acc);color:var(--acc-ink);padding:3px 8px;border-radius:4px;white-space:nowrap}
.pn{font-weight:600;min-width:0}
.sc b{font-family:var(--font-d);font-size:1.4rem}
.sc i{font:.75rem var(--font-m);font-style:normal;color:var(--mute)}
.bar{grid-column:1 / 3;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--acc);border-radius:4px}
.lvl{font:500 .75rem var(--font-m);color:var(--mute);text-align:right}
.pb{padding:2px 16px 16px;border-top:1px solid var(--line)}
.cap{font-size:.86rem;border-left:3px solid var(--stamp);padding:4px 0 4px 10px;color:var(--ink)}
.fr{display:grid;grid-template-columns:minmax(0,1fr) 80px 90px;gap:10px;align-items:center;font-size:.85rem;padding:3px 0}
.fr .mono{text-align:right;font-size:.78rem}
.fr.neg .mono{color:var(--stamp)}
.mini{height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
.mini span{display:block;height:100%;background:var(--mute)}
.tabw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:14px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.86rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--font-m);text-transform:uppercase;letter-spacing:.07em;color:var(--mute);background:var(--soft)}
tr.on td{background:var(--soft)}
tr:last-child td{border-bottom:0}
.verdict{border:1px solid var(--acc);border-radius:8px;padding:14px 16px;margin-top:14px}
.verdict b{font-family:var(--font-d);font-size:1.1rem}
ul.tight{margin:6px 0 10px;padding-left:20px}
ul.tight li{margin-bottom:5px;max-width:68ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.box{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--bg);min-width:0}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.prog span{display:block;height:100%;background:var(--ok)}
.out{font-family:var(--font-m);font-size:.86rem;background:var(--soft);border-radius:6px;padding:10px 12px;min-height:44px;overflow-wrap:anywhere}
footer{margin-top:26px;font-size:.8rem;color:var(--mute);max-width:90ch}
footer a{color:var(--acc)}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:84px;resize:vertical;min-width:0}
.step.gap{margin-top:14px}
.day{margin:16px 0 4px}.day h3{font-size:1rem;text-transform:capitalize}.day .sm{display:block;margin-top:2px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.slot{font:500 .85rem var(--font-m);padding:8px 12px;border-radius:6px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;min-width:70px}
.slot.taken,.slot.blocked{border-color:var(--line);color:var(--mute);background:var(--soft);cursor:not-allowed}
.slot.blocked{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,transparent 6px 12px)}
.slot.mine{background:var(--ok);border-color:var(--ok);color:var(--acc-ink);cursor:default}
.slot.sel{background:var(--acc);color:var(--acc-ink)}
.stf .slot{cursor:pointer}
.chip{font:500 .72rem var(--font-m);padding:3px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;display:inline-block}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.wait{color:var(--warn);border-color:var(--warn)}.chip.bad{color:var(--stamp);border-color:var(--stamp)}
.pay{border:1px solid var(--acc);border-radius:8px;padding:12px 14px;margin-top:10px}
.fr2{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:4px 0;font-size:.88rem}
.fr2>span:first-child{min-width:120px;color:var(--mute)}.fr2 .mono{overflow-wrap:anywhere}
.fld.need{outline:2px solid var(--warn);outline-offset:3px;border-radius:6px}
.hrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:8px}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0;align-items:center}
.jump .sm{margin-right:4px}
.jump button{font:500 .76rem var(--font-m);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--acc);cursor:pointer}
.jump button[aria-current]{background:var(--acc);color:var(--acc-ink)}
.btn.xs{padding:5px 10px;font-size:.78rem;display:inline-block}
.bkrow{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.bkrow .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:20;max-width:calc(100vw - 32px)}
@media (max-width:780px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .step{border-left:0;border-bottom:2px solid var(--line);white-space:nowrap;flex:0 0 auto}
  .step[aria-current="step"]{border-bottom-color:var(--acc)}
  section.panel{padding:18px}
  .fr{grid-template-columns:minmax(0,1fr) 64px 56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
//ENGINE_START
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const EDU={none:0,assoc:1,bach:2,mast:3,phd:4};
const ENG={none:0,basic:1,mid:2,good:3,fluent:4};
const HOT=['tech','health','eng','fin'];
const F=(k,pts,max)=>({k,pts:Math.round(pts),max});
function finish(f,cap,capKey,branch){
  const raw=f.reduce((a,x)=>a+x.pts,0);
  let s=raw; if(cap!=null) s=Math.min(s,cap);
  s=clamp(Math.round(s),3,90);
  return {score:s,factors:f,capKey:capKey||null,branch:branch||null};
}
const refusal=(p,n)=>p.refusal==='yes'?[F('f_refusal',-n,0)]:[];
function scoreH1B(p){
  const e=EDU[p.edu];
  const f=[F('f_edu',[0,4,18,26,30][e],30),F('f_exp',Math.min(p.exp,8)*2,16),
    F('f_offer',{none:0,talk:8,offer:25}[p.offer],25),F('f_eng',ENG[p.eng]*2,8),
    F('f_field',HOT.includes(p.field)?8:3,8),F('f_abroad',{none:0,visit:2,short:3,long:4}[p.abroad],4),...refusal(p,12)];
  if(e<2) return finish(f,12,'cap_h1b_edu');
  if(p.offer!=='offer') return finish(f,35,'cap_h1b_offer');
  return finish(f);
}
function scoreO1(p){
  const f=[F('f_achv',{none:0,local:12,nat:30,intl:46}[p.achv],46),F('f_exp',Math.min(p.exp,10)*1.5,15),
    F('f_edu',[0,2,5,8,10][EDU[p.edu]],10),F('f_offer',{none:0,talk:6,offer:14}[p.offer],14),
    F('f_eng',ENG[p.eng]*1.5,6),F('f_field',['tech','health','eng','creative'].includes(p.field)?4:2,4),...refusal(p,10)];
  return p.achv==='none'?finish(f,12,'cap_o1_achv'):finish(f);
}
function scoreL1(p){
  const f=[F('f_intl',{none:2,plan:22,yes:52}[p.intl],52),F('f_exp',Math.min(p.exp,10)*1.2,12),
    F('f_edu',[0,1,4,6,8][EDU[p.edu]],8),F('f_eng',ENG[p.eng]*1.5,6),...refusal(p,10)];
  if(p.intl==='none') return finish(f,10,'cap_l1');
  if(p.intl==='plan') return finish(f,45,'cap_l1_plan');
  return finish(f);
}
function scoreE2(p){
  const f=[F('f_funds',{none:0,lt50:10,mid:26,hi:42,top:52}[p.funds],52),F('f_treaty',15,15),
    F('f_exp',Math.min(p.exp,10)*1.2,12),F('f_eng',ENG[p.eng]*1.5,6),...refusal(p,10)];
  return p.funds==='none'?finish(f,10,'cap_e2'):finish(f);
}
function scoreF1(p){
  const f=[F('f_admit',{none:0,applied:14,admitted:40}[p.usAdmit],40),F('f_eng',ENG[p.eng]*4,16),
    F('f_funds',{none:0,lt50:6,mid:14,hi:20,top:22}[p.funds],22),F('f_edu',[4,6,8,8,8][EDU[p.edu]],8),
    F('f_abroad',{none:0,visit:3,short:4,long:5}[p.abroad],5),...refusal(p,15)];
  return p.usAdmit==='none'?finish(f,15,'cap_f1'):finish(f);
}
function scoreGC(p){
  const emp=[F('f_offer',{none:0,talk:6,offer:28}[p.offer],28),F('f_edu',[0,2,8,13,16][EDU[p.edu]],16),
    F('f_exp',Math.min(p.exp,8)*2,16),F('f_achv',{none:0,local:3,nat:10,intl:20}[p.achv],20),F('f_eng',ENG[p.eng]*1.5,6)];
  const empSum=emp.reduce((a,x)=>a+x.pts,0);
  const famPts={none:0,other:30,imm:70}[p.fam];
  if(famPts>=empSum && famPts>0){
    return finish([F('f_fam',famPts,70),F('f_eng',ENG[p.eng]*2,8)],null,null,'br_fam');
  }
  const weak=p.offer!=='offer'&&p.achv==='none';
  return finish(emp,weak?20:null,weak?'cap_gc':null,'br_emp');
}
const CALC={h1b:scoreH1B,o1:scoreO1,l1:scoreL1,e2:scoreE2,f1:scoreF1,gc:scoreGC};
const PATHS=['h1b','o1','l1','e2','f1','gc'];
const DEMAND={tech:'hi',health:'hi',eng:'hi',fin:'mid',edu:'mid',creative:'mid',trades:'hi',other:'low'};
function scoreJob(p){
  const f=[F('f_demand',{hi:14,mid:8,low:3}[DEMAND[p.field]],14),F('f_exp',Math.min(p.exp,10)*1.8,18),
    F('f_edu',[0,2,6,9,10][EDU[p.edu]],10),F('f_cred',EDU[p.edu]>=2?{no:0,plan:4,done:12}[p.cred]:0,12),
    F('f_eng',ENG[p.eng]*3.5,14),F('f_abroad',{none:0,visit:1,short:2,long:4}[p.abroad],4),
    F('f_net',{none:0,some:6,strong:12}[p.net],12),F('f_cv',{no:0,draft:3,ready:8}[p.cv],8),
    F('f_cert',p.cert?4:0,4)];
  return p.auth==='none'?finish(f,40,'cap_job_auth'):finish(f);
}
const level=s=>s>=70?4:s>=50?3:s>=25?2:1;
//ENGINE_END

function setStep(n){
  cur=n;
  document.querySelectorAll('.panel').forEach((el,i)=>el.classList.toggle('on',i+1===n));
  document.querySelectorAll('.step').forEach((el,i)=>{if(i+1===n)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});
  window.scrollTo({top:0});
}
app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.go){setStep(+b.dataset.go);}
  else if(b.dataset.lang){lang=b.dataset.lang;save();shell();}
  else if(b.dataset.reset){const chk=p.chk;p=Object.assign({},DEF,{chk});save();shell();}
  else if(b.dataset.copy){
    const txt=document.getElementById('b_out').textContent;
    const ok=()=>{b.textContent=t('copied');setTimeout(()=>{b.textContent=t('copy');},1400);};
    try{navigator.clipboard.writeText(txt).then(ok,()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('b_out'));const s=getSelection();s.removeAllRanges();s.addRange(r);});}
    catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById('b_out'));const s=getSelection();s.removeAllRanges();s.addRange(r);}
  }
});
function onField(e){
  const el=e.target;
  if(el.id&&el.id.startsWith('b_')&&el.id!=='b_copy'&&el.id!=='b_out'){buildBullet();return;}
  if(el.dataset.c){p.chk[el.dataset.c]=el.checked;save();updateChk();return;}
  const k=el.dataset.k; if(!k)return;
  if(el.type==='checkbox')p[k]=el.checked;
  else if(el.type==='number')p[k]=clamp(parseInt(el.value,10)||0,0,40);
  else p[k]=el.value;
  save();renderRes2();renderRes3();renderRes4();
}

const sameTZ=()=>new Date().getTimezoneOffset()===-180;

function dayLabel(ds){const d=new Date(Date.UTC(+ds.slice(0,4),+ds.slice(4,6)-1,+ds.slice(6,8)));return d.toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});}
function trStamp(ms){const d=new Date(ms+TR_OFF*3600e3);return `${pad(d.getUTCDate())}.${pad(d.getUTCMonth()+1)}.${d.getUTCFullYear()} ${pad(d.getUTCHours())}:00`;}
const locStamp=ms=>new Date(ms).toLocaleString(loc(),{weekday:'short',hour:'2-digit',minute:'2-digit'});
function weekendDays(weeks){
  const out=[],n=new Date(Date.now()+TR_OFF*3600e3),y=n.getUTCFullYear(),m=n.getUTCMonth(),d=n.getUTCDate();
  for(let i=0;i<(weeks||8)*7;i++){
    const day=new Date(Date.UTC(y,m,d+i)),wd=day.getUTCDay();
    if(wd!==6&&wd!==0)continue;
    const ds=`${day.getUTCFullYear()}${pad(day.getUTCMonth()+1)}${pad(day.getUTCDate())}`;
    out.push({ds,hours:HOURS.map(h=>({h,s:Date.UTC(day.getUTCFullYear(),day.getUTCMonth(),day.getUTCDate(),h-TR_OFF)}))});
  }
  return out;
}
const sid=(cal,ds,h)=>`${cal}-${ds}-${pad(h)}`;
function refCode(id){let h=0;const s=id+'|'+MY;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return 'ABD-'+h.toString(36).toUpperCase().padEnd(5,'0').slice(0,5);}

/* slot ownership: earliest valid claim wins; unpaid claims lapse after 48 h */
function winner(id){
  const now=Date.now(),c=[];
  for(const uid in S.claims){const s=S.claims[uid]&&S.claims[uid].slots&&S.claims[uid].slots[id];if(s)c.push(Object.assign({uid},s));}
  const valid=c.filter(x=>{const py=S.pay[x.uid+'~'+id];if(py&&py.cancelled)return false;if(py&&py.confirmed)return true;if(x.claimed)return true;return x.at+HOLD_MS>now;});
  valid.sort((a,b)=>{const pa=S.pay[a.uid+'~'+id],pb=S.pay[b.uid+'~'+id];const ca=pa&&pa.confirmed?0:1,cb=pb&&pb.confirmed?0:1;return ca-cb||a.at-b.at;});
  return valid[0]||null;
}
function slotState(id){
  if(S.avail[id]&&S.avail[id].blocked)return 'blocked';
  const w=winner(id);if(!w)return 'free';
  return w.uid===MY?'mine':'taken';
}
function statusFor(uid,id,it){
  const py=S.pay[uid+'~'+id];
  if(py&&py.cancelled)return 'cancel';
  if(py&&py.confirmed)return 'ok';
  const w=winner(id);
  if(!w||w.uid!==uid)return it.at+HOLD_MS<Date.now()?'expired':'lost';
  const c=S.claims[uid]&&S.claims[uid].slots&&S.claims[uid].slots[id];
  return c&&c.claimed?'claimed':'pending';
}
const chipCls=s=>s==='ok'?'ok':(s==='pending'||s==='claimed')?'wait':'bad';
const feeUSD=cal=>cal==='a'?(S.cfg.usdAtt||100):(S.cfg.usd||100);
const fmtIban=s=>String(s||'').replace(/\s/g,'').replace(/(.{4})/g,'$1 ').trim();
function ibanOK(s){
  s=String(s).replace(/\s/g,'').toUpperCase();
  if(!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(s))return false;
  const r=s.slice(4)+s.slice(0,4);let rem=0;
  for(const ch of r){const v=/\d/.test(ch)?ch:String(ch.charCodeAt(0)-55);for(const d of v)rem=(rem*10+Number(d))%97;}
  return rem===1;
}

function calHTML(cal,mode){
  const now=Date.now();
  const days=weekendDays(8).map(day=>{
    const hrs=day.hours.filter(x=>mode==='staff'||x.s>now+LEAD_MS);
    if(!hrs.length)return '';
    const btns=hrs.map(x=>{
      const id=sid(cal,day.ds,x.h),st=slotState(id),lab=`${pad(x.h)}:00`;
      if(mode==='staff')return `<button class="slot ${st}" data-a="toggle" data-id="${id}" title="${t(st)}">${lab}</button>`;
      const sel=pick&&pick.id===id?' sel':'';
      if(st==='free')return `<button class="slot free${sel}" data-a="pick" data-cal="${cal}" data-id="${id}" data-s="${x.s}">${lab}</button>`;
      return `<button class="slot ${st}" disabled title="${t(st)}">${lab}</button>`;
    }).join('');
    const first=hrs[0].s,last=hrs[hrs.length-1].s;
    const lc=!sameTZ()&&mode!=='staff'?`<span class="sm">${t('loc')}: ${locStamp(first)} – ${locStamp(last)}</span>`:'';
    return `<div class="day"><h3>${dayLabel(day.ds)}</h3>${lc}<div class="slots">${btns}</div></div>`;
  }).join('');
  return `<div>${days}</div>`;
}

  cl.slots[p0.id]={cal:p0.cal,at:Date.now(),start:p0.s,claimed:null};

  }

  }

  else if(a==='confirm'){enq(()=>DB.doc('pay/'+uid+'~'+id).set({confirmed:true,at:Date.now()}));}

async function initDb(){

    if(!window.claude||!window.claude.use){LOADING=false;renderLive(true);return;}
    const [dbm,um]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);

    MY=await um.id();
    const can=await um.can('data.write');
    if(!MY||can===false){LOADING=false;renderLive(true);return;}
    DB=dbm;LOADING=false;
    const coll=(path,key)=>DB.collection(path).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data();});S[key]=o;schedule();},()=>{});
    const one=(path,key,guard)=>DB.doc(path).onSnapshot(s=>{if(guard&&guard())return;S[key]=s.data()||(key==='cfg'?{}:null);schedule();},()=>{});
    coll('claims','claims');coll('pay','pay');coll('avail','avail');
    one('cfg/pay','cfg');one('bk/'+MY,'mybk');one('dos/'+MY,'mydos',()=>!!dosTimer);one('stf/'+MY,'mystf');
    if(await um.canEdit()){
      coll('bk','allbk');coll('dos','alldos');coll('stf','allstf');
      STAFF=true;shell();
    }
    renderLive(true);
  }catch(err){LOADING=false;DB=null;renderLive(true);}
}

//PARSER_START
const MON='(?:ocak|şubat|subat|mart|nisan|mayıs|mayis|haziran|temmuz|ağustos|agustos|eylül|eylul|ekim|kasım|kasim|aralık|aralik|jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
const DT='(?:'+MON+'\\.?\\s*\\d{4}|\\d{1,2}[./]\\d{4}|\\d{4}[./-](?:0?[1-9]|1[0-2])(?!\\d)|\\d{4})';
const NOWW='(?:present|current|now|halen|günümüz|gunumuz|devam(?:\\s*ediyor)?|şu\\s*an|su\\s*an|bugün)';
const MMAP={oca:1,jan:1,şub:2,sub:2,feb:2,mar:3,nis:4,apr:4,may:5,haz:6,jun:6,tem:7,jul:7,ağu:8,agu:8,aug:8,eyl:9,sep:9,eki:10,oct:10,kas:11,nov:11,ara:12,dec:12};
function parseDT(s,isEnd,nowD){
  s=String(s).toLowerCase().trim();
  if(new RegExp('^'+NOWW+'$','i').test(s))return {y:nowD.getFullYear(),m:nowD.getMonth()+1,open:true};
  const y=+(/\d{4}/.exec(s)||[])[0];if(!y)return null;
  let m=null,mm;
  if((mm=/^([a-zçğıöşü]+)/.exec(s))){m=MMAP[mm[1].slice(0,3)]||null;}
  else if((mm=/^(\d{1,2})[./]\d{4}/.exec(s))){m=+mm[1];}
  else if((mm=/^\d{4}[./-](\d{1,2})/.exec(s))){m=+mm[1];}
  if(!m)m=isEnd?12:1;
  if(isEnd&&y===nowD.getFullYear()&&m>nowD.getMonth()+1)m=nowD.getMonth()+1;
  return {y,m};
}
function findRanges(line,nowD){
  const re=new RegExp('('+DT+')\\s*(?:-|–|—|to|until|ila)\\s*('+DT+'|'+NOWW+')','ig'),out=[];let r;
  while((r=re.exec(line))){
    const a=parseDT(r[1],false,nowD),b=parseDT(r[2],true,nowD);
    if(a&&b&&a.y>=1960&&a.y<=nowD.getFullYear()+1&&(b.y*12+b.m)>=(a.y*12+a.m))out.push({a,b,raw:r[0],idx:r.index});
  }
  return out;
}
const pm=n=>String(n).padStart(2,'0');
const ym=d=>d.y+'-'+pm(d.m);
function sectionsOf(lines){
  const H={exp:/^(i̇ş deneyimi|iş deneyimi|is deneyimi|deneyim|work experience|professional experience|experience|employment(?: history)?|çalışma geçmişi|calisma gecmisi)\s*:?$/i,
    edu:/^(eğitim|egitim|eğitim bilgileri|education|academic background|academic)\s*:?$/i,
    other:/^(skills|beceriler|yetenekler|languages|diller|yabancı dil|projects|projeler|certificates?|sertifikalar|references|referanslar|interests|ilgi alanları|hobiler|summary|özet|profile|profil|hakkımda|about me|awards|ödüller|publications|yayınlar|courses|kurslar)\s*:?$/i};
  const sec={exp:[],edu:[],rest:[]};let cur='rest';
  lines.forEach(l=>{
    const t0=l.trim();
    if(t0.length<=40){
      if(H.exp.test(t0)){cur='exp';return;}
      if(H.edu.test(t0)){cur='edu';return;}
      if(H.other.test(t0)){cur='rest';return;}
    }
    sec[cur].push(l);
  });
  return sec;
}
function parseCV(text,nowD){
  nowD=nowD||new Date();
  const lines=String(text).replace(/\r/g,'\n').split('\n').map(l=>l.replace(/[ \t]+/g,' ').trim()).filter(Boolean);
  const all=lines.join('\n'),sec=sectionsOf(lines);
  const found={},hist={work:[],edu:[]};
  // work entries
  const workLines=sec.exp.length?sec.exp:lines.filter(l=>!sec.edu.includes(l));
  const seen=new Set();
  workLines.forEach((l,i)=>{
    findRanges(l,nowD).forEach(r=>{
      if(/üniversite|university|lise\b|high school|okul\b|college/i.test(l)&&!sec.exp.length)return;
      let head=(l.slice(0,r.idx)+' '+l.slice(r.idx+r.raw.length)).replace(/[|•·()]/g,' ').replace(/\s+/g,' ').trim();
      if(head.length<3)head=(workLines[i-1]||'').trim();
      let title=head,org='';
      const sp=head.split(/\s+(?:-|–|—|\||@|at)\s+|,\s+/);
      if(sp.length>=2){title=sp[0];org=sp[1];}
      const key=(title+org+ym(r.a)).toLowerCase();if(seen.has(key))return;seen.add(key);
      hist.work.push({title:title.slice(0,80),org:org.slice(0,80),from:ym(r.a),to:r.b.open?'':ym(r.b)});
    });
  });
  // years of experience: union of months
  const ivs=hist.work.map(w=>{const a=+w.from.slice(0,4)*12+ +w.from.slice(5)-1;const b=w.to?+w.to.slice(0,4)*12+ +w.to.slice(5)-1:nowD.getFullYear()*12+nowD.getMonth();return [a,b];}).sort((x,y)=>x[0]-y[0]);
  let months=0,end=-1;ivs.forEach(([a,b])=>{if(b<=end)return;months+=b-Math.max(a,end+1)+1;end=b;});
  const phrase=/(\d{1,2})\s*\+?\s*(?:years?|yıl|yil)\b[^.\n]{0,25}(?:experience|deneyim|tecrübe)/i.exec(all);
  if(hist.work.length){found.exp={v:Math.min(40,Math.round(months/12)),ev:hist.work.length+' kayıt, '+months+' ay'};}
  else if(phrase){found.exp={v:Math.min(40,+phrase[1]),ev:phrase[0]};}
  // education entries
  sec.edu.forEach((l,i)=>{
    findRanges(l,nowD).forEach(r=>{
      let head=(l.slice(0,r.idx)+' '+l.slice(r.idx+r.raw.length)).replace(/[|•·()]/g,' ').replace(/\s+/g,' ').trim();
      if(head.length<3)head=(sec.edu[i-1]||'').trim();
      let school=head,degree='';
      const sp=head.split(/\s+(?:-|–|—|\|)\s+|,\s+/);
      if(sp.length>=2){school=sp[0];degree=sp[1];}
      hist.edu.push({school:school.slice(0,80),degree:degree.slice(0,80),from:ym(r.a),to:ym(r.b)});
    });
  });
  // education level
  const eduText=sec.edu.length?sec.edu.join('\n'):all.replace(/scrum master|master data|webmaster|web master|master chef|master of ceremon\w*/ig,' ');
  let lv=null,ev='',low=false,mm;
  if((mm=/\b(ph\.?d|doctorate|doktora)\b/i.exec(eduText))){lv='phd';ev=mm[0];}
  else if((mm=/\b(m\.?sc|master'?s?|mba|yüksek lisans|yuksek lisans)\b/i.exec(eduText))){lv='mast';ev=mm[0];}
  else if((mm=/\b(bachelor'?s?|b\.?sc|bsc|b\.a\.|b\.s\.|lisans(?!üstü)|undergraduate|mühendisliği|mühendislik fakültesi)\b/i.exec(eduText))){lv='bach';ev=mm[0];}
  else if((mm=/\b(associate|önlisans|on lisans|ön lisans|meslek yüksekokulu|myo)\b/i.exec(eduText))){lv='assoc';ev=mm[0];}
  else if((mm=/üniversite|university|college/i.exec(eduText))){lv='bach';ev=mm[0];low=true;}
  else if((mm=/\b(lise|high school)\b/i.exec(eduText))){lv='none';ev=mm[0];}
  if(lv)found.edu={v:lv,ev,low};
  // field
  const KW={
   tech:/software|developer|yazılım|programmer|devops|data scientist|veri bilim|front.?end|back.?end|full.?stack|javascript|python|\bsql\b|cloud|bilgisayar mühendis|computer engineer|information technology|bilişim/ig,
   health:/\bnurse|hemşire|physician|doktor|hekim|dentist|diş hekim|pharmac|eczac|physiotherap|fizyoterap|clinic|klinik|hospital|hastane|medical|\btıp\b/ig,
   eng:/civil engineer|inşaat mühendis|mechanical|makine mühendis|electrical engineer|elektrik mühendis|industrial engineer|endüstri mühendis|autocad|solidworks|mühendis\b/ig,
   fin:/financ|finans|accountant|muhasebe|\baudit|denetim|\bbank|banka|\bcpa\b|\bcfa\b|treasury|investment|yatırım/ig,
   edu:/teacher|öğretmen|lecturer|akademisyen|professor|profesör|research assistant|araştırma görevlisi/ig,
   creative:/designer|tasarımcı|\bux\b|graphic|grafik|architect|mimar|video editor|editör|photograph|fotoğraf|\bwriter\b|\byazar\b|illustrat/ig,
   trades:/electrician|elektrikçi|plumber|tesisat|welder|kaynakçı|technician|teknisyen|\bchef\b|aşçı|mechanic|tamirci|carpenter|marangoz/ig};
  let best=null,bc=0;
  Object.keys(KW).forEach(k=>{const c=(all.match(KW[k])||[]).length;if(c>bc){bc=c;best=k;}});
  if(best)found.field={v:best,ev:bc+' eşleşme'};
  // english
  let eng=null,eev='';
  const el=lines.filter(l=>/english|ingilizce/i.test(l)||/ielts|toefl/i.test(l));
  const ej=el.join(' ');
  if((mm=/ielts[^0-9]{0,15}([0-9](?:\.[0-9])?)/i.exec(all))){const s=+mm[1];eng=s>=8?'fluent':s>=7?'good':s>=5.5?'mid':s>=4?'basic':'none';eev=mm[0];}
  else if((mm=/toefl[^0-9]{0,20}(\d{2,3})/i.exec(all))){const s=+mm[1];eng=s>=105?'fluent':s>=90?'good':s>=72?'mid':s>=42?'basic':'none';eev=mm[0];}
  else if(ej){
    if((mm=/\b(c2|native|mother tongue|anadil|fluent|akıcı|proficient)\b/i.exec(ej))){eng='fluent';eev=mm[0];}
    else if((mm=/\b(c1|advanced|ileri)\b/i.exec(ej))){eng='good';eev=mm[0];}
    else if((mm=/\b(b2|upper.?intermediate|intermediate|orta)\b/i.exec(ej))){eng='mid';eev=mm[0];}
    else if((mm=/\b(b1|basic|temel|elementary)\b/i.exec(ej))){eng='basic';eev=mm[0];}
    else if((mm=/\b(a1|a2|beginner|başlangıç)\b/i.exec(ej))){eng='none';eev=mm[0];}
  }
  if(eng)found.eng={v:eng,ev:eev};
  // school/major line
  const sl=(sec.edu.length?sec.edu:lines).find(l=>/üniversite|university|college/i.test(l));
  if(sl)found.major={v:sl.replace(/\s+/g,' ').slice(0,80),ev:''};
  return {found,hist};
}

const HK=['addr','work','edu','us','intl'];
const HH=()=>p.hist||(p.hist={addr:[],work:[],edu:[],us:[],intl:[]});
const HCOLS={
 addr:[['line','h_line','text'],['from','h_from','month'],['to','h_to','month']],
 work:[['title','h_title','text'],['org','h_org','text'],['from','h_from','month'],['to','h_to','month']],
 edu:[['school','h_school','text'],['degree','h_degree','text'],['from','h_from','month'],['to','h_to','month']],
 us:[['from','h_from','date'],['to','h_to','date'],['note','h_note','text']],
 intl:[['country','h_country','text'],['from','h_from','date'],['to','h_to','date']]
};
const mIdx=s=>{const m=/^(\d{4})-(\d{2})/.exec(s||'');return m?(+m[1])*12+(+m[2])-1:null;};
const mLabel=i=>Math.floor(i/12)+'-'+pad(i%12+1);
function gapsOf(list){
  const n=new Date(),cur=n.getFullYear()*12+n.getMonth(),lo=cur-60,cov=new Set();
  list.forEach(e=>{let a=mIdx(e.from);if(a==null)return;let b=e.to?mIdx(e.to):cur;if(b==null)b=cur;a=Math.max(a,lo);b=Math.min(b,cur);for(let i=a;i<=b;i++)cov.add(i);});
  const out=[];let st=null;
  for(let i=lo;i<=cur;i++){if(!cov.has(i)){if(st==null)st=i;}else if(st!=null){out.push([st,i-1]);st=null;}}
  if(st!=null)out.push([st,cur]);
  return out;
}
function gapHTML(){
  const h=HH();
  const one=(k,title)=>{
    if(!h[k].length)return `<li><b>${t(title)}:</b> ${t('gap_empty')}</li>`;
    const g=gapsOf(h[k]);
    return g.length?`<li class="cap"><b>${t(title)}:</b> ${t('gap_warn')}: ${g.map(x=>mLabel(x[0])+' → '+mLabel(x[1])).join(', ')}. ${t('gap_fix')}</li>`:`<li><b>${t(title)}:</b> ${t('gap_ok')}</li>`;
  };
  const last2=h.work.slice().sort((a,b)=>String(b.from).localeCompare(String(a.from))).slice(0,2);
  return `<ul class="tight" style="list-style:none;padding:0">${one('addr','hl_addr')}${one('work','hl_work')}</ul>
   ${last2.length?`<h4>${t('ds_two')}</h4><ul class="tight">${last2.map(w=>`<li>${esc(w.title)}${w.org?' · '+esc(w.org):''} <span class="mono sm">${esc(w.from)} → ${esc(w.to||'…')}</span></li>`).join('')}</ul>`:''}`;
}
function histRows(k){
  return HH()[k].map((e,i)=>`<div class="hrow" data-l="${k}" data-i="${i}">${HCOLS[k].map(c=>`<label class="fld"><span>${t(c[1])}</span><input type="${c[2]==='text'?'text':c[2]}" data-h="${c[0]}" ${c[2]==='month'?'placeholder="YYYY-MM"':''} maxlength="90" value="${esc(e[c[0]]||'')}"></label>`).join('')}<button class="btn ghost xs" data-a="hdel" data-l="${k}" data-i="${i}">${t('h_del')}</button></div>`).join('');

function renderHist(){
  const el=document.getElementById('histbox');if(!el)return;
  el.innerHTML=`<div class="box" style="margin-top:24px"><h3>${t('hist_h')}</h3><p class="sm" style="margin-top:6px">${t('hist_i')}</p><p class="sm">${t('hist_src')}</p>
   ${HK.map(k=>`<h4>${t('hl_'+k)}</h4>${histRows(k)}<button class="btn ghost xs" data-a="hadd" data-l="${k}">${t('h_add')}</button>`).join('')}
   <div id="gapbox" style="margin-top:16px">${gapHTML()}</div>
   <div style="margin-top:12px"><button class="btn ghost xs" data-a="hsum">${t('hsum')}</button></div></div>`;
}
function histSummary(){
  const h=HH(),lines=[];
  const fmt=(k,f)=>h[k].slice().sort((a,b)=>String(a.from).localeCompare(String(b.from))).map(f).join('\n')||'-';
  lines.push(t('hl_addr')+':\n'+fmt('addr',e=>`${e.from} → ${e.to||'…'}  ${e.line}`));
  lines.push(t('hl_work')+':\n'+fmt('work',e=>`${e.from} → ${e.to||'…'}  ${e.title}${e.org?', '+e.org:''}`));
  lines.push(t('hl_edu')+':\n'+fmt('edu',e=>`${e.from} → ${e.to||'…'}  ${e.school}${e.degree?', '+e.degree:''}`));
  lines.push(t('hl_us')+':\n'+fmt('us',e=>`${e.from} → ${e.to||''}  ${e.note||''}`));
  lines.push(t('hl_intl')+':\n'+fmt('intl',e=>`${e.from} → ${e.to||''}  ${e.country}`));
  return lines.join('\n\n');
}

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function readFile(f){
  const n=f.name.toLowerCase();
  if(n.endsWith('.txt'))return await f.text();
  const buf=await f.arrayBuffer();
  if(n.endsWith('.docx')){
    if(!window.mammoth)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await window.mammoth.extractRawText({arrayBuffer:buf})).value;
  }
  if(n.endsWith('.pdf')){
    if(!window.pdfjsLib)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc=await window.pdfjsLib.getDocument({data:buf}).promise;let out='';
    for(let i=1;i<=doc.numPages;i++){
      const pg=await doc.getPage(i),tc=await pg.getTextContent();let y=null,line='';
      tc.items.forEach(it=>{const yy=Math.round(it.transform[5]);if(y!==null&&Math.abs(yy-y)>3){out+=line.trim()+'\n';line='';}y=yy;line+=it.str+' ';});
      out+=line.trim()+'\n';
    }
    return out;
  }
  throw new Error('type');
}

});
