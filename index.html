   <h2 style="margin:28px 0 0">${t('hm_w_h')}</h2><div class="hw">${t('hm_w').map((x,i)=>`<div><b>${x[0]}</b><span class="sm">${i===1&&!aptOn()?t('hm_price_hide'):x[1]}</span></div>`).join('')}</div>
   <h2 style="margin:28px 0 4px">${t('hm_q_h')}</h2><div class="hq">${t('hm_q').map(x=>`<details><summary><b>${x[0]}</b></summary><p class="sm" style="margin:6px 0 0">${x[1]}</p></details>`).join('')}</div>
   <div class="scope" role="note" style="display:block;margin-top:24px"><strong>${t('scope_h')}</strong><p>${scopeP()}</p></div>
   <div class="notice" style="display:flex"><strong>${t('stamp')}</strong><span>${t('disc')}</span></div>`;
}
function layoutPages(){
  if(document.getElementById('pg-home'))return;
  const foot=app.querySelector('footer');if(!foot)return;
  const mk=id=>{const d=document.createElement('div');d.id=id;d.className='pg';return d;};
  const home=mk('pg-home'),viz=mk('pg-vizeler'),rota=mk('pg-rota'),dan=mk('pg-danismanlik'),guv=mk('pg-guvenlik');
  const q=s=>app.querySelector(s);
  const mv=(box,...els)=>els.forEach(e=>{if(e)box.appendChild(e);});
  const E={vb:q('#visabox'),sb:q('#statbox'),ib:q('#introbox'),sh:q('.shell'),gb:q('#gatebox'),sc:q('.scope'),nt:q('.notice')};
  mv(viz,E.vb,E.sb);mv(rota,E.ib,E.sh);mv(dan,E.gb,E.sc,E.nt);
  const sf=document.createElement('div');sf.id='sfpage';guv.appendChild(sf);
  home.innerHTML=homeHTML();
  [home,viz,rota,dan,guv].forEach(d=>foot.before(d));
  const hd=q('header.top');
  if(hd){const nv=document.createElement('nav');nv.id='pnav';nv.className='pnav';nv.setAttribute('aria-label','Pages');
    nv.innerHTML=ROUTES.map(r=>`<button type="button" class="btn ghost xs" data-route="${r}">${t(NAVL[r])}</button>`).join('');hd.after(nv);
    const br=hd.querySelector('.brand');if(br){br.setAttribute('role','link');br.tabIndex=0;br.dataset.route='home';}}
  const hb=q('.hero-in .btn');
  if(hb&&!q('.hero-in .hb2')){const w=cfg('contact_whatsapp').replace(/\D/g,'');if(w){const a=document.createElement('a');a.className='btn hb2';a.style.cssText='margin-left:8px;background:transparent;color:#fff;border-color:#fff;text-shadow:none';a.target='_blank';a.rel='noopener noreferrer';a.href=`https://wa.me/${w}?text=${encodeURIComponent(t('pk_wamsg'))}`;a.textContent=t('hero_b2');hb.after(a);}}
  applyRoute(true);safeRender();
}
const _re9=renderExtras;
renderExtras=function(){_re9();layoutPages();};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-route]');if(!b)return;

});

.exw .exlead{color:var(--mute);margin:8px 0 0;max-width:640px}
.exrule{display:flex;gap:12px;align-items:center;margin:18px 0 22px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;background:var(--panel)}
.exrule b{font-family:var(--font-d)}.exrule .q{font-family:var(--font-m);font-size:12px;color:var(--mute)}
.exstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:26px}
.exchip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;text-decoration:none;color:inherit;cursor:pointer;font:inherit}
.exchip:hover{border-color:var(--acc)}
.exav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;background:var(--soft);font-family:var(--font-d);font-size:18px;flex:none}
.exchip .n{font-weight:600;display:block}.exchip .v{font-family:var(--font-m);font-size:12px;color:var(--mute);display:block}
.exres{display:inline-block;margin-top:8px;font-family:var(--font-m);font-size:12px;font-weight:500;padding:3px 8px;border-radius:999px;border:1.5px solid currentColor}
.exyes{color:var(--ok)}.exno{color:var(--stamp)}
.excase{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;display:grid;grid-template-columns:250px 1fr 170px;gap:18px;scroll-margin-top:70px}
.exwho{display:flex;flex-direction:column;gap:10px}.exwho .top{display:flex;gap:10px;align-items:center}.exwho .exav{margin:0}
.exwho h3{font-family:var(--font-d);font-size:20px;margin:0}
.exbadge{font-family:var(--font-m);font-size:12px;background:var(--soft);padding:2px 8px;border-radius:6px;display:inline-block}
.exfacts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.exfacts li{padding-left:16px;position:relative}.exfacts li:before{content:"";position:absolute;left:3px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--mute)}
.exflow{display:flex;flex-direction:column}
.exst{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:7px 0;position:relative}
.exst:not(:last-child):after{content:"";position:absolute;left:14px;top:34px;bottom:-8px;width:2px;background:var(--line)}
.exic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--panel);position:relative;z-index:1}
.exic.y{background:var(--ok)}.exic.x{background:var(--stamp)}
.exst .q{font-weight:600;font-size:14px}.exst .a{font-size:13.5px;color:var(--mute)}
.exdec{border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px;gap:8px;border:2px dashed currentColor}
.exdec .st{font-family:var(--font-d);font-size:20px;line-height:1.1;border:3px solid currentColor;border-radius:8px;padding:6px 10px;transform:rotate(-6deg)}
.exdec .law{font-family:var(--font-m);font-size:12px}.exdec .why{font-size:13px;color:var(--ink)}
.exless{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.exless div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.exless b{font-family:var(--font-d);font-size:16px;display:block;margin-bottom:2px}.exless span{font-size:13.5px;color:var(--mute)}
@media (max-width:860px){.excase{grid-template-columns:1fr}.exdec{flex-direction:row;justify-content:flex-start;text-align:left}.exstrip{gap:6px}.exchip{padding:10px 3px}.exchip .v{font-size:10.5px}.exless{grid-template-columns:1fr}}
@media (max-width:480px){.exav{width:36px;height:36px;font-size:15px}.exchip .n{font-size:13px}.exres{font-size:9.5px;padding:2px 4px}}`;document.head.appendChild(st);})();
ROUTES.splice(ROUTES.indexOf('vizeler')+1,0,'ornekler');
NAVL.ornekler='nv_ex';
function exHTML(){
  const C=t('ex_c');
  const strip=C.map((c,i)=>`<button type="button" class="exchip" data-exj="${i}"><span class="exav">${esc(c.n[0])}</span><span class="n">${esc(c.n)}</span><span class="v">${esc(c.vs)}</span><span class="exres ${c.ok?'exyes':'exno'}">${c.ok?'✓':'✗'} ${esc(c.res)}</span></button>`).join('');
  const cards=C.map((c,i)=>`<article class="excase" id="exc${i}"><div class="exwho"><div class="top"><div class="exav">${esc(c.n[0])}</div><div><h3>${esc(c.n)}, ${c.a}</h3><span class="exbadge">${esc(c.v)}</span></div></div>
    <ul class="exfacts">${c.f.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="exflow">${c.s.map(s=>`<div class="exst"><div class="exic ${s[0]?'y':'x'}" aria-label="${s[0]?'✓':'✗'}">${s[0]?'✓':'✗'}</div><div><div class="q">${esc(s[1])}</div><div class="a">${esc(s[2])}</div></div></div>`).join('')}</div>
    <div class="exdec ${c.ok?'exyes':'exno'}"><div class="st">${c.st}</div>${c.law?`<div class="law">${c.law}</div>`:''}<div class="why">${esc(c.why)}</div></div></article>`).join('');
  return `<div class="exw"><h1>${t('ex_h')}</h1><p class="exlead">${t('ex_lead')}</p>
   <div class="exrule"><div style="font-size:26px" aria-hidden="true">⚖️</div><div><b>${t('ex_rule')}</b><br><span class="q">${t('ex_rule2')}</span></div></div>
   <nav class="exstrip" aria-label="${t('nv_ex')}">${strip}</nav>${cards}
   <h2 style="margin:28px 0 0">${t('ex_diff')}</h2><div class="exless">${t('ex_l').map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
   <div class="box" style="margin-top:22px;border-color:var(--acc)"><p style="margin:0 0 10px">${t('ex_cta')}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-route="rota">${t('ex_cta1')}</button><button class="btn ghost" data-route="danismanlik">${t('ex_cta2')}</button></div></div>
   <p class="sm" style="margin-top:18px;color:var(--mute)">${t('ex_note')}</p></div>`;
}
const _lp10=layoutPages;
layoutPages=function(){
  _lp10();
  document.documentElement.lang=lang;
  if(document.getElementById('pg-ornekler')||!document.getElementById('pg-vizeler'))return;
  const d=document.createElement('div');d.id='pg-ornekler';d.className='pg';d.innerHTML=exHTML();
  document.getElementById('pg-vizeler').after(d);
  const g=document.querySelector('#pg-home .hgrid');
  if(g&&!g.querySelector('[data-route=ornekler]')){const b=document.createElement('div');b.className='box';
    b.innerHTML=`<h3 style="margin:0">${t('ex_hm_h')}</h3><p class="sm" style="margin:0">${t('ex_hm_p')}</p><button class="btn ghost" data-route="ornekler">${t('ex_hm_b')}</button>`;
    g.children[0]?g.children[0].after(b):g.appendChild(b);}
  try{document.title='ABD Rotası'+(ROUTE==='home'?'':' · '+t(NAVL[ROUTE]));}catch(e){}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-exj]');if(!b)return;
  const el=document.getElementById('exc'+b.dataset.exj);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});

function cbProfile(){
  const a=CB.a;
  return {edu:a.edu||'none',field:a.field||'other',exp:+(a.exp||0),eng:a.eng||'none',abroad:a.abroad||'none',refusal:a.refusal||'no',
    offer:a.offer||'none',achv:a.achv||'none',intl:a.intl||'none',funds:a.funds||'none',usAdmit:a.usAdmit||'none',fam:a.fam||'none'};
}
function cbTies(){
  const a=CB.a,T=cbL().tie;let s=0;const pos=[],neg=[];
  if(a.job==='ins'){s+=2;pos.push(T.ins);}else if(a.job==='own'){s+=2;pos.push(T.own);}else if(a.job==='student'){s+=1;pos.push(T.student);}else{neg.push(T.nojob);}
  if(a.famtr==='kids'){s+=2;pos.push(T.married);pos.push(T.kids);}else if(a.famtr==='married'){s+=1;pos.push(T.married);}else if(a.famtr==='single'){neg.push(T.single);}
  if(['a25','a35','a45'].includes(a.age)){s+=a.age==='a25'?1:2;pos.push(T.age25);}else if(a.age==='a18'){neg.push(T.age18);}
  if(a.abroad&&a.abroad!=='none'){s+=1;pos.push(T.abroad);}else{neg.push(T.noabroad);}
  if(['mid','hi','top'].includes(a.funds)){s+=2;pos.push(T.funds);}else if(a.funds==='lt50'){s+=1;pos.push(T.funds);}else{neg.push(T.nofunds);}
  if(a.refusal==='yes'){s-=2;neg.push(T.refusal);}
  const lv=s>=6?'strong':s>=3?'mid':'weak';
  return {lv,pos,neg};
}
function cbPlan(){
  const a=CB.a,X=cbL(),R=X.r,W=X.why,S=X.st,FL=X.fl,SV=X.sv;
  const pr=cbProfile();const sc={};PATHS.forEach(k=>{try{sc[k]=CALC[k](pr).score;}catch(e){sc[k]=0;}});
  const plan={route:'',why:'',alt:[],steps:[],flags:[],svc:[SV.free],ties:null,us:false};
  const need={pkg:false,att:false};
  if(a.loc==='us'){
    plan.us=true;plan.route=R.status;
    plan.why=a.usst==='none'?S.us_none:(a.usst==='gc'?S.us_gc:S.us_now);
    plan.steps=[S.attorney];
    need.att=true;
  }else{
    const ties=cbTies();plan.ties=ties;const weak=ties.lv==='weak';
    const ladder=[S.ins,S.save,S.schengen,S.docs,S.ds160,S.mock];
    const g=a.goal;
    if(g==='visit'){
      plan.route=R.b2;plan.why=weak?W.ladder:W.b2;
      plan.steps=weak?ladder:(ties.lv==='mid'?[S.docs,a.abroad==='none'?S.schengen:S.save,S.ds160,S.mock]:[S.docs,S.ds160,S.mock]);
      need.pkg=true;
    }else if(g==='study'){
      plan.route=R.f1;plan.why=W.f1;
      plan.steps=[S.school,a.usAdmit==='admitted'?null:S.i20,S.ffund,['none','basic'].includes(a.eng)?S.engup:null,S.sevis,S.mock].filter(Boolean);
      if(weak)plan.alt.push([R.b2,W.ladder]);
      need.pkg=true;
    }else if(g==='work'){
      const hasB=['bach','mast','phd'].includes(a.edu);
      if(a.intl==='yes'||a.intl==='plan'){plan.route=R.l1;plan.why=W.l1;plan.steps=[S.l1chk,S.attorney,S.ds160,S.mock];need.att=true;}
      else if(['nat','intl'].includes(a.achv)){plan.route=R.o1;plan.why=W.o1;plan.steps=[S.o1ev,S.attorney,S.sponsor];need.att=true;}
      else{plan.route=R.h1b;plan.why=hasB?W.h1b:W.h1bno;plan.steps=[S.cv,S.cred,S.sponsor,S.lottery];if(!hasB)plan.steps.unshift(S.degree);if(a.offer==='offer')need.att=true;}
      if(plan.route!==R.o1&&['nat','intl'].includes(a.achv))plan.alt.push([R.o1,W.o1]);
      if(plan.route!==R.f1)plan.alt.push([R.f1,W.f1]);
      need.pkg=true;
    }else if(g==='invest'){
      const ok=['mid','hi','top'].includes(a.funds);
      plan.route=R.e2;plan.why=ok?W.e2:W.e2low;
      plan.steps=[S.biz,S.src,S.atrisk,S.attorney].concat(ok?[]:[S.b1]);
      need.att=true;need.pkg=true;
    }else if(g==='family'){
      plan.route=R.fam;plan.why=a.fam==='imm'?W.famimm:(a.fam==='other'?W.famoth:W.famnone);
      plan.steps=a.fam==='none'?[S.dvapply,S.save]:[S.attorney,S.docs];
      if(a.fam==='none')plan.alt.push([R.b2,W.b2]);
      need.att=a.fam!=='none';
    }else if(g==='settle'){
      if(a.fam==='imm'){plan.route=R.fam;plan.why=W.famimm;plan.steps=[S.attorney,S.docs];need.att=true;}
      else if(a.offer==='offer'){plan.route=R.gcemp;plan.why=W.gcemp;plan.steps=[S.attorney,S.cred];need.att=true;}
      else{plan.route=R.dv;plan.why=W.dv;plan.steps=[S.dvapply,S.cv,S.engup];}
      plan.alt.push([R.dv,W.dv]);if(a.offer!=='offer')plan.alt.push([R.gcemp,W.gcemp]);
      plan.alt=plan.alt.filter(x=>x[0]!==plan.route);
    }else{
      const order=['f1','h1b','o1','l1'].concat(a.job==='own'?['e2']:[]).sort((x,y)=>sc[y]-sc[x]);const best=order[0];
      const BS={f1:[S.school,a.usAdmit==='admitted'?null:S.i20,S.ffund,S.sevis,S.mock].filter(Boolean),h1b:[S.cv,S.cred,S.sponsor,S.lottery],o1:[S.o1ev,S.attorney],l1:[S.l1chk,S.attorney],e2:[S.biz,S.src,S.atrisk,S.attorney]};
      if(sc[best]>=35){plan.route=R[best];plan.why=W[best]||'';plan.steps=BS[best];if(best!=='f1')need.att=true;}
      else{plan.route=R.b2;plan.why=weak?W.ladder:W.b2;plan.steps=weak?ladder:[S.docs,S.ds160,S.mock];}
      if(!plan.steps.length)plan.steps=[S.attorney];
      plan.alt.push([R.dv,W.dv]);need.pkg=true;
    }
    if(a.refusal==='yes')plan.flags.push(FL.refusal);
    if(a.age==='a18'&&a.famtr==='single')plan.flags.push(FL.young);
    if(a.funds==='none'&&['study','invest'].includes(g))plan.flags.push(FL.nofund);
    if(a.abroad==='none'&&['visit','study','unsure'].includes(g))plan.flags.push(FL.noabroad);
    if(['none','basic'].includes(a.eng)&&['study','work'].includes(g))plan.flags.push(FL.eng);
    if(a.when==='3m'&&weak)plan.flags.push(FL.rush);
    if(a.loc==='oth')plan.flags.push(FL.oth);
    plan.flags.push(FL.money);
  }
  if(need.pkg){plan.svc.push(SV.pkg);plan.svc.push(SV.ds);}
  if(need.att)plan.svc.push(SV.att);
  plan.goal=cbLabel('goal',a.goal);plan.scores=sc;
  return plan;
}
function cbPlanText(pl){
  const L2=t;const a=CB.a;const lines=[];
  lines.push(L2('cb_plan_h')+(a.name?' – '+a.name:''));
  lines.push(L2('cb_goal')+': '+pl.goal);
  lines.push(L2('cb_route')+': '+pl.route);
  if(pl.why)lines.push(pl.why);
  if(pl.ties)lines.push(L2('cb_ties')+': '+t('cb_tie_lv')[pl.ties.lv]);
  if(pl.alt.length)lines.push(L2('cb_alt')+': '+pl.alt.map(x=>x[0]).join(', '));
  lines.push('');lines.push(L2('cb_steps')+':');pl.steps.forEach((s,i)=>lines.push((i+1)+'. '+s));
  if(pl.flags.length){lines.push('');lines.push(L2('cb_flags')+':');pl.flags.forEach(s=>lines.push('- '+s));}
  lines.push('');lines.push(L2('cb_svc')+':');pl.svc.forEach(s=>lines.push('- '+s));
  lines.push('');lines.push(L2('cb_note'));
  return lines.join('\n');
}
function cbPlanHTML(pl,printMode){
  const a=CB.a,li=x=>`<li>${esc(x)}</li>`;
  const ties=pl.ties?`<div class="cbsec"><b>${t('cb_ties')}: <span class="cbtie cbt-${pl.ties.lv}">${t('cb_tie_lv')[pl.ties.lv]}</span></b>
     <ul class="cbck">${pl.ties.pos.map(x=>`<li class="y">✓ ${esc(x)}</li>`).join('')}${pl.ties.neg.map(x=>`<li class="x">✗ ${esc(x)}</li>`).join('')}</ul><p class="sm">${t('cb_tie_note')}</p></div>`:'';
  return `<div class="cbplan"><h3>${t('cb_plan_h')}${a.name?', '+esc(a.name):''}</h3>
   <div class="cbsec"><span class="sm">${t('cb_goal')}: ${esc(pl.goal)}</span><div class="cbroute">${esc(pl.route)}</div><p>${esc(pl.why)}</p>
   ${pl.alt.length?`<p class="sm"><b>${t('cb_alt')}:</b> ${pl.alt.map(x=>esc(x[0])).join(' · ')}</p>`:''}</div>
   ${ties}
   <div class="cbsec"><b>${t('cb_steps')}</b><ol>${pl.steps.map(li).join('')}</ol></div>
   ${pl.flags.length?`<div class="cbsec cbflag"><b>${t('cb_flags')}</b><ul>${pl.flags.map(li).join('')}</ul></div>`:''}
   <div class="cbsec"><b>${t('cb_svc')}</b><ul>${pl.svc.map(li).join('')}</ul></div>
   <p class="sm">${t('cb_note')}</p>${printMode?`<p class="sm">ABD Rotası — ${esc(BRAND_SUB)} · ${new Date().toLocaleDateString(lang==='en'?'en-US':'tr-TR')}</p>`:''}</div>`;
}

function cbEnsure(){
  let f=document.getElementById('cbfab');
  if(!f){f=document.createElement('button');f.id='cbfab';f.type='button';f.dataset.cb='open';document.body.appendChild(f);}
  f.innerHTML=`<span aria-hidden="true">💬</span><span>${t('cb_fab')}</span>`;f.hidden=CB.open;
  let pn=document.getElementById('cbpanel');
  if(!pn){pn=document.createElement('div');pn.id='cbpanel';pn.setAttribute('role','dialog');pn.setAttribute('aria-modal','false');pn.hidden=true;document.body.appendChild(pn);}
  pn.setAttribute('aria-label',t('cb_title'));
  return pn;
}
function cbRender(keepScroll){
  const pn=cbEnsure();pn.hidden=!CB.open;if(!CB.open)return;
  const body=[];const bot=x=>`<div class="cbm bot">${x}</div>`,me=x=>`<div class="cbm me">${esc(x)}</div>`;
  body.push(bot(esc(t('cb_hi'))));body.push(bot(`<span class="sm">${esc(t('cb_hi2'))}</span>`));
  if(!CB.started){body.push(`<div class="cbopts"><button type="button" data-cb="start">${t('cb_start')}</button></div>`);}
  else{
    CB.hist.forEach(id=>{body.push(bot(esc(t('cb_q')[id])));body.push(me(cbLabel(id,CB.a[id])));
      if(id==='name'&&CB.a.name)body.push(bot(esc(t('cb_hello').replace('{n}',CB.a.name))));});
    const q=cbNext();
    if(cbMinor()){body.push(bot(esc(t('cb_minor'))));body.push(cbWaBtn(true));}
    else if(q){
      body.push(bot(esc(t('cb_q')[q.id])));
      if(q.type!=='text')body.push(`<div class="cbopts">${cbOptsOf(q.id).map(o=>`<button type="button" data-cbv="${esc(o[0])}">${esc(o[1])}</button>`).join('')}</div>`);
    }else{
      const pl=cbPlan();
      body.push(cbPlanHTML(pl,false));
      body.push(`<div class="cbact">${cbWaBtn(false)}<button type="button" class="btn ghost" data-cb="print">${t('cb_print')}</button>${pl.us?'':`<button type="button" class="btn ghost" data-cb="score">${t('cb_score')}</button><span class="sm">${t('cb_score_n')}</span>`}</div>`);
      body.push(cbSaveHTML());
      body.push(`<div class="cbsec"><b>${t('cb_ai_h')}</b><p class="sm">${t('cb_ai_p')}</p></div>`);
      CB.ai.forEach(m=>body.push(m.role==='user'?me(m.content):bot(esc(m.content))));
      if(CB.aiBusy)body.push(bot(`<span class="sm">${t('cb_ai_wait')}</span>`));
    }
  }
  const q=CB.started?cbNext():null,done=CB.started&&!q&&!cbMinor();
  const total=cbTotal(),n=Math.min(CB.hist.length+1,total);
  let foot='';
  if(q&&q.type==='text')foot=`<form class="cbft" data-cbf="text"><input id="cbin" type="text" maxlength="40" autocomplete="given-name" aria-label="${esc(t('cb_q')[q.id])}"><button class="btn ghost xs" type="button" data-cb="skip">${t('cb_skip')}</button><button class="btn xs" type="submit">${t('cb_send')}</button></form>`;
  else if(done)foot=`<form class="cbft" data-cbf="ai"><input id="cbai" type="text" maxlength="600" placeholder="${esc(t('cb_ai_ph'))}" aria-label="${esc(t('cb_ai_h'))}" ${CB.aiBusy?'disabled':''}><button class="btn xs" type="submit" ${CB.aiBusy?'disabled':''}>${t('cb_send')}</button></form>`;
  const prev=pn.querySelector('.cbbody');const st=prev?prev.scrollTop:0;
  pn.innerHTML=`<div class="cbhd"><span aria-hidden="true">💬</span><b>${t('cb_title')}</b>${CB.hist.length?`<button type="button" data-cb="back">${t('cb_back')}</button><button type="button" data-cb="restart">${t('cb_restart')}</button>`:''}<button type="button" data-cb="close" aria-label="${t('cb_close')}">✕</button></div>
   ${q&&CB.started?`<div class="cbprog" style="padding-top:6px">${t('cb_prog')} ${n}/${total}</div>`:''}
   <div class="cbbody" aria-live="polite">${body.join('')}</div>${foot}`;
  const b=pn.querySelector('.cbbody');
  if(keepScroll)b.scrollTop=st;else b.scrollTop=b.scrollHeight;
  const inp=pn.querySelector('#cbin');if(inp&&window.matchMedia('(min-width:561px)').matches)inp.focus();
}
function cbWaBtn(minor){
  const w=cfg('contact_whatsapp').replace(/\D/g,'');if(!w)return '';
  let msg=t('cb_wamsg');
  if(!minor){const pl=cbPlan(),a=CB.a;
    msg+=`\n${a.name?(lang==='en'?'Name: ':'Ad: ')+a.name+'\n':''}${t('cb_goal')}: ${pl.goal}\n${t('cb_route')}: ${pl.route}${pl.ties?'\n'+t('cb_ties')+': '+t('cb_tie_lv')[pl.ties.lv]:''}\n${lang==='en'?'Timing: ':'Zaman: '}${cbLabel('when',a.when)}\n${t('pk_wamsg')}`;}
  return `<a class="btn" style="background:#1E7A4F;border-color:#1E7A4F;color:#fff" target="_blank" rel="noopener noreferrer" href="https://wa.me/${w}?text=${encodeURIComponent(msg)}">${t('cb_wa')}</a>`;
}
function cbSaveHTML(){
  if(CB.saved)return `<div class="cbsec"><b>✓ ${t('cb_saved')}</b></div>`;
  const F=CB.form;
  return `<div class="cbsec"><b>${t('cb_save_h')}</b><p class="sm">${t('cb_save_p')}</p>
   <div class="cbform"><input type="text" id="cbfn" maxlength="80" placeholder="${esc(t('cb_f_name'))}" aria-label="${esc(t('cb_f_name'))}" value="${esc(F.name||CB.a.name||'')}">
   <input type="tel" id="cbfp" maxlength="25" placeholder="${esc(t('cb_f_phone'))}" aria-label="${esc(t('cb_f_phone'))}" value="${esc(F.phone)}">
   <input type="email" id="cbfm" maxlength="120" placeholder="${esc(t('cb_f_mail'))}" aria-label="${esc(t('cb_f_mail'))}" value="${esc(F.mail)}">
   <label><input type="checkbox" id="cbfc" ${F.ok?'checked':''}> <span>${t('cb_consent')}</span></label>
   <button type="button" class="btn" data-cb="save" ${CB.saveBusy?'disabled':''}>${t('cb_save_b')}</button>${CB.saveMsg?`<span class="cbmsg">${esc(CB.saveMsg)}</span>`:''}</div></div>`;
}
function cbOpen(){CB.open=true;cbRender();const pn=document.getElementById('cbpanel');const c=pn&&pn.querySelector('[data-cb=start],[data-cbv],#cbin');if(c&&!c.matches('#cbin'))c.focus({preventScroll:true});}
function cbAnswer(v){const q=cbNext();if(!q)return;CB.a[q.id]=v;CB.hist.push(q.id);
  // amaç/konum değişirse artık geçerli olmayan cevapları temizle
  CB.hist=CB.hist.filter(id=>{const qq=CBQ.find(x=>x.id===id);return !qq.when||qq.when(CB.a);});
  CB.saved=false;CB.saveMsg='';cbSave();cbRender();}
function cbPrint(){
  const pl=cbPlan();
  const css=`body{font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif;color:#0E1A2B;margin:24px;max-width:720px}h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px}
   .cbsec{border:1px solid #CBD3DF;border-radius:10px;padding:10px 12px;margin:0 0 10px}.cbroute{font-size:18px;font-weight:700}.sm{font-size:12px;color:#53637B}
   .cbck{list-style:none;padding-left:0}.y{color:#1E7A4F}.x{color:#B3202F}.cbtie{border:1px solid currentColor;border-radius:999px;padding:0 6px}`;
  const fr=document.createElement('iframe');fr.style.cssText='position:fixed;width:0;height:0;border:0;right:0;bottom:0';document.body.appendChild(fr);
  const d=fr.contentWindow.document;d.open();d.write(`<!doctype html><html lang="${lang}"><head><meta charset="utf-8"><title>ABD Rotası – ${esc(t('cb_plan_h'))}</title><style>${css}</style></head><body>${cbPlanHTML(pl,true)}</body></html>`);d.close();
  setTimeout(()=>{try{fr.contentWindow.focus();fr.contentWindow.print();}catch(e){}setTimeout(()=>fr.remove(),1500);},250);
}
async function cbSaveLead(){
  const F=CB.form;F.name=(document.getElementById('cbfn')||{}).value||'';F.phone=(document.getElementById('cbfp')||{}).value||'';F.mail=(document.getElementById('cbfm')||{}).value||'';F.ok=!!(document.getElementById('cbfc')||{}).checked;
  if(!F.ok){CB.saveMsg=t('cb_need_consent');return cbRender(true);}
  if(!F.phone.trim()&&!F.mail.trim()){CB.saveMsg=t('cb_need_contact');return cbRender(true);}
  if(!SB){CB.saveMsg=t('cb_save_err');return cbRender(true);}
  CB.saveBusy=true;CB.saveMsg='';cbRender(true);
  const pl=cbPlan();
  const row={lang,answers:CB.a,plan_text:cbPlanText(pl).slice(0,6000),route:pl.route.slice(0,120),ties:pl.ties?pl.ties.lv:null,
    full_name:F.name.trim().slice(0,80)||null,phone:F.phone.trim().slice(0,25)||null,email:F.mail.trim().slice(0,120)||null,consent:true,user_agent:navigator.userAgent.slice(0,200)};
  try{const {error}=await SB.from('chat_leads').insert(row);if(error)throw error;CB.saved=true;CB.saveMsg='';}
  catch(e){CB.saveMsg=t('cb_save_err');}
  CB.saveBusy=false;cbSave();cbRender(true);
}
async function cbAsk(txt){
  txt=(txt||'').trim().slice(0,600);if(!txt||CB.aiBusy)return;
  CB.ai.push({role:'user',content:txt});CB.aiBusy=true;cbRender();
  let reply='';
  try{
    if(!SB||!SB.functions)throw new Error('off');
    const pl=cbPlan();
    const {data,error}=await SB.functions.invoke('chat-ai',{body:{lang,context:cbPlanText(pl).slice(0,3000),messages:CB.ai.slice(-10)}});
    if(error){const st=error.context&&error.context.status;let code='';try{code=(await error.context.json()).error;}catch(_){}
      reply=code==='quota'||st===429?t('cb_ai_quota'):(code==='not_configured'||code==='disabled'||st===404||st===503?t('cb_ai_off'):t('cb_ai_err'));}
    else reply=(data&&data.reply)||t('cb_ai_err');
  }catch(e){reply=t('cb_ai_off');}
  CB.ai.push({role:'assistant',content:String(reply).slice(0,3000)});CB.aiBusy=false;cbSave();cbRender();
}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-cbv]');if(v){cbAnswer(v.dataset.cbv);return;}
  const b=e.target.closest('[data-cb]');if(!b)return;const a=b.dataset.cb;
  if(a==='open')cbOpen();
  else if(a==='close'){CB.open=false;cbRender();cbEnsure();const f=document.getElementById('cbfab');if(f)f.focus();}
  else if(a==='start'){CB.started=true;cbSave();cbRender();}
  else if(a==='skip'){cbAnswer('');}
  else if(a==='back'){const id=CB.hist.pop();if(id)delete CB.a[id];if(id==='age'||id==='goal'||id==='loc'){}cbSave();cbRender();}
  else if(a==='restart'){CB.a={};CB.hist=[];CB.ai=[];CB.saved=false;CB.saveMsg='';CB.started=true;cbSave();cbRender();}
  else if(a==='print')cbPrint();
  else if(a==='save')cbSaveLead();
  else if(a==='score'){const pr=cbProfile();Object.assign(p,pr);save();CB.open=false;cbRender();shell();go('rota');}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-cbf]');if(!f)return;e.preventDefault();
  if(f.dataset.cbf==='text'){const v=(document.getElementById('cbin').value||'').trim().replace(/[<>]/g,'').slice(0,40);cbAnswer(v);}
  else{const i=document.getElementById('cbai');const v=i.value;i.value='';cbAsk(v);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CB.open){CB.open=false;cbRender();cbEnsure();}});
document.addEventListener('change',e=>{const id=e.target&&e.target.id;if(!/^cbf[npmc]$/.test(id||''))return;const F=CB.form;
  if(id==='cbfn')F.name=e.target.value;else if(id==='cbfp')F.phone=e.target.value;else if(id==='cbfm')F.mail=e.target.value;else F.ok=e.target.checked;cbSave();});

const SAFE_VER='safe-v2';

/* veri: aktif/son zamanlayıcı */
const _sbLoadC=sbLoad;
sbLoad=async function(){
  if(SB&&SBU){
    const r=await SB.from('safe_checkins').select('*').gt('created_at',new Date(Date.now()-864e5).toISOString()).order('created_at',{ascending:false});
    SBST.ciErr=!!(r&&r.error);SBST.ci=((r&&r.data)||[]).find(x=>x.status==='active'||x.status==='alerted')||null;
  }else{SBST.ci=null;SBST.ciErr=false;}
  await _sbLoadC();
};
/* şart sürümü safe-v2 */
const _sbLoadV=sbLoad;
sbLoad=async function(){
  await _sbLoadV();
  if(SB&&SBU){const g=await SB.from('agreements').select('version,full_name,created_at').eq('version',SAFE_VER);
    SBST.agSafe=(g&&g.data&&g.data[0])||null;}else SBST.agSafe=null;
  safeRender();
};

safeFab=function(){const f=document.getElementById('sosfab');if(f)f.remove();};

const nowStr=()=>new Date().toLocaleTimeString(lang==='en'?'en-US':'tr-TR',{hour:'2-digit',minute:'2-digit'});
function nowMsg(){
  const note=(SAFE.note||'').trim(),n=note?t('sf_nownote').replace('{n}',note):'';
  const p=SAFE.pos;
  if(p&&p.lat!=null)return t('sf_nowmsg').replace('{who}',whoName()).replace('{time}',p.time).replace('{map}',`https://www.google.com/maps?q=${p.lat.toFixed(6)},${p.lng.toFixed(6)}`).replace('{note}',n);
  return t('sf_nowmsg_nomap').replace('{who}',whoName()).replace('{time}',p?p.time:nowStr()).replace('{note}',n);
}
function ciLeft(c){return Math.max(0,Math.round((new Date(c.due_at).getTime()-Date.now())/60000));}

      const auto=!idle?'':(hasMail0?`<div style="margin:0 0 10px;padding:10px;border:1px solid var(--line);border-radius:8px"><label class="chk"><input id="sf_ciauto" type="checkbox" ${SAFE.ciAuto?'checked':''}><span>${t('sf_ciauto')}</span></label>
          <label class="fld" for="sf_cidur" style="max-width:280px;margin-top:8px"><span>${t('sf_cidur_h')}</span><select id="sf_cidur">${t('ci_durs').map(o=>`<option value="${o[0]}" ${SAFE.ciDur===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label></div>`:`<p class="cap" style="margin:0 0 10px">${t('ci_noemail')}</p>`);

      const m=alertMsg(a),enc=encodeURIComponent(m);

};

document.addEventListener('change',e=>{if(e.target.id==='sf_cidur')SAFE.ciDur=e.target.value;else if(e.target.id==='sf_ciauto')SAFE.ciAuto=e.target.checked;});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-sa]');if(!b)return;const a=b.dataset.sa;
  if(a==='locnow'){
    SAFE.locBusy=true;SAFE.msg='';safeRender();
    const p=await getPos();SAFE.locBusy=false;
    SAFE.pos=p?{lat:p.lat,lng:p.lng,time:nowStr()}:{lat:null,lng:null,time:nowStr()};
    if(!p)SAFE.msg=t('sf_noloc');
    safeRender();
  }
  else if(a==='accept2'){
    const nm=SAFE.name.trim();
    if(!SAFE.c1||nm.length<3){SAFE.msg=t('ag_need');safeRender();return;}
    const txt=t('sf_terms').join('\n')+'\n'+t('sf_c1');
    const {error}=await SB.from('agreements').insert({version:SAFE_VER,full_name:nm,lang,text_sha256:await sha256(txt),user_agent:navigator.userAgent.slice(0,200),consent_terms:true,consent_data:true});
    if(error){SAFE.msg=error.message;safeRender();return;}
    SAFE.msg='';await sbLoad();
  }
  else if(a==='shr'){
    /* bağlantı normal açılır; arkada zamanlayıcıyı otomatik başlat */
    if(!SAFE.ciAuto||SAFE.ciBusy||(SBST.ci&&SBST.ci.status==='active')||!(SBST.sc||[]).some(c=>c.email))return;
    SAFE.ciBusy=true;
    const mins=Math.min(1440,Math.max(5,parseInt(SAFE.ciDur,10)||120));
    const row={note:(SAFE.note||'').trim().slice(0,300)||null,due_at:new Date(Date.now()+mins*60000).toISOString(),lang};
    if(SAFE.pos&&SAFE.pos.lat!=null){row.lat=SAFE.pos.lat;row.lng=SAFE.pos.lng;}
    const {error}=await SB.from('safe_checkins').insert(row);
    SAFE.ciBusy=false;
    SAFE.msg=error?(SBST.ciErr?t('ci_dberr'):t('ci_autono')+' '+error.message):t('ci_autook');
    await sbLoad();
  }
  else if(a==='ci_cancel'){
    const C=SBST.ci;if(!C)return;SAFE.ciBusy=true;safeRender();
    const {error}=await SB.from('safe_checkins').update({status:'cancelled'}).eq('id',C.id).eq('status','active');
    SAFE.ciBusy=false;SAFE.msg=error?error.message:t('ci_cancelok');await sbLoad();
  }
});

setInterval(()=>{const el=document.getElementById('sf_ci_left');const C=SBST.ci;if(!el||!C||C.status!=='active')return;
