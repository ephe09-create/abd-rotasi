<html lang="tr">
<head>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: boarding-pass header, sticky step rail on the left, one step panel on the right. */
:root{
  --bg:#EDF0F4; --panel:#FAFBFD; --ink:#0E1A2B; --mute:#53637B; --line:#CBD3DF;
  --acc:#1D4FA8; --acc-ink:#FFFFFF; --soft:#E1E8F4; --stamp:#B3202F; --ok:#1E7A4F; --warn:#9A5B00;
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-b:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A111E; --panel:#111B2D; --ink:#E6ECF5; --mute:#9BAAC2; --line:#26344C;
    --acc:#7FAAFF; --acc-ink:#0A111E; --soft:#17253D; --stamp:#FF7A86; --ok:#5FD39B; --warn:#F2B35E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111E; --panel:#111B2D; --ink:#E6ECF5; --mute:#9BAAC2; --line:#26344C;
  --acc:#7FAAFF; --acc-ink:#0A111E; --soft:#17253D; --stamp:#FF7A86; --ok:#5FD39B; --warn:#F2B35E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.7rem;letter-spacing:-.01em}
h3{font-size:1.15rem}
h4{font-family:var(--font-m);font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:500;margin:18px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.mono{font-family:var(--font-m)}
.sm{font-size:.82rem;color:var(--mute)}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--font-d);font-size:1.6rem;letter-spacing:-.02em}
.brand span{font-family:var(--font-m);font-size:.78rem;color:var(--mute)}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{font:500 .8rem var(--font-m);padding:6px 12px;background:transparent;color:var(--mute);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.notice{margin:16px 0 22px;display:grid;gap:6px;border:1px dashed var(--stamp);border-radius:6px;padding:12px 14px;font-size:.88rem}
.notice strong{font-family:var(--font-m);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--stamp)}
.notice span{max-width:90ch}
.shell{display:grid;grid-template-columns:190px minmax(0,1fr);gap:32px;align-items:start}
nav.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:10px;align-items:baseline;text-align:left;background:transparent;border:0;border-left:2px solid var(--line);padding:9px 10px;color:var(--mute);font:500 .95rem var(--font-b);cursor:pointer}
.step i{font:500 .75rem var(--font-m);font-style:normal}
.step[aria-current="step"]{border-left-color:var(--acc);color:var(--ink);background:var(--soft)}
.step:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
section.panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px;min-width:0}
section.panel.on{display:block}
.intro{color:var(--mute);margin:8px 0 18px}
.grp{margin:22px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px;margin-top:8px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld span{font-size:.82rem;font-weight:600}
.fld small{color:var(--mute);font-size:.76rem}
select,input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.chk input{margin-top:4px;accent-color:var(--acc)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.btn{font:600 .9rem var(--font-b);padding:10px 16px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc)}
.sample{font-size:.8rem;color:var(--mute);margin-top:6px}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;background:var(--soft);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.sum .mono{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.sum strong{font-family:var(--font-d);font-size:1.2rem}
.sum .big{font-family:var(--font-d);font-size:1.9rem;font-weight:700;color:var(--acc)}
details.path{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--bg)}
details.path>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 14px}
details.path>summary::-webkit-details-marker{display:none}
.code{font:500 .78rem var(--font-m);background:var(--acc);color:var(--acc-ink);padding:3px 8px;border-radius:4px;white-space:nowrap}
.pn{font-weight:600;min-width:0}
.sc b{font-family:var(--font-d);font-size:1.4rem}
.sc i{font:.75rem var(--font-m);font-style:normal;color:var(--mute)}
.bar{grid-column:1 / 3;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--acc);border-radius:4px}
.lvl{font:500 .75rem var(--font-m);color:var(--mute);text-align:right}
.pb{padding:2px 16px 16px;border-top:1px solid var(--line)}
.cap{font-size:.86rem;border-left:3px solid var(--stamp);padding:4px 0 4px 10px;color:var(--ink)}
.fr{display:grid;grid-template-columns:minmax(0,1fr) 80px 90px;gap:10px;align-items:center;font-size:.85rem;padding:3px 0}
.fr .mono{text-align:right;font-size:.78rem}
.fr.neg .mono{color:var(--stamp)}
.mini{height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
.mini span{display:block;height:100%;background:var(--mute)}
.tabw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:14px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.86rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--font-m);text-transform:uppercase;letter-spacing:.07em;color:var(--mute);background:var(--soft)}
tr.on td{background:var(--soft)}
tr:last-child td{border-bottom:0}
.verdict{border:1px solid var(--acc);border-radius:8px;padding:14px 16px;margin-top:14px}
.verdict b{font-family:var(--font-d);font-size:1.1rem}
ul.tight{margin:6px 0 10px;padding-left:20px}
ul.tight li{margin-bottom:5px;max-width:68ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.box{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--bg);min-width:0}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.prog span{display:block;height:100%;background:var(--ok)}
.out{font-family:var(--font-m);font-size:.86rem;background:var(--soft);border-radius:6px;padding:10px 12px;min-height:44px;overflow-wrap:anywhere}
footer{margin-top:26px;font-size:.8rem;color:var(--mute);max-width:90ch}
footer a{color:var(--acc)}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:84px;resize:vertical;min-width:0}
.step.gap{margin-top:14px}
.day{margin:16px 0 4px}.day h3{font-size:1rem;text-transform:capitalize}.day .sm{display:block;margin-top:2px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.slot{font:500 .85rem var(--font-m);padding:8px 12px;border-radius:6px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;min-width:70px}
.slot.taken,.slot.blocked{border-color:var(--line);color:var(--mute);background:var(--soft);cursor:not-allowed}
.slot.blocked{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,transparent 6px 12px)}
.slot.mine{background:var(--ok);border-color:var(--ok);color:var(--acc-ink);cursor:default}
.slot.sel{background:var(--acc);color:var(--acc-ink)}
.stf .slot{cursor:pointer}
.chip{font:500 .72rem var(--font-m);padding:3px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;display:inline-block}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.wait{color:var(--warn);border-color:var(--warn)}.chip.bad{color:var(--stamp);border-color:var(--stamp)}
.pay{border:1px solid var(--acc);border-radius:8px;padding:12px 14px;margin-top:10px}
.fr2{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:4px 0;font-size:.88rem}
.fr2>span:first-child{min-width:120px;color:var(--mute)}.fr2 .mono{overflow-wrap:anywhere}
.fld.need{outline:2px solid var(--warn);outline-offset:3px;border-radius:6px}
.hrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:8px}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0;align-items:center}
.jump .sm{margin-right:4px}
.jump button{font:500 .76rem var(--font-m);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--acc);cursor:pointer}
.jump button[aria-current]{background:var(--acc);color:var(--acc-ink)}
.lk{font:500 .62rem var(--font-m);margin-left:6px;color:var(--warn);font-style:normal}
.hero{position:relative;border-radius:12px;overflow:hidden;margin:0 0 16px;background:#1b2740;min-height:240px}
.hero img{display:block;width:100%;height:clamp(260px,44vw,440px);object-fit:cover;object-position:50% 62%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,14,30,.78) 0%,rgba(8,14,30,.5) 45%,rgba(8,14,30,0) 80%)}
.hero-in{position:absolute;z-index:1;left:clamp(16px,4vw,44px);bottom:clamp(16px,4vw,40px);max-width:min(520px,86%);color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.hero-in h1{font:700 clamp(1.5rem,4.2vw,2.5rem)/1.15 var(--font-d);margin:0 0 8px;color:#fff}
.hero-in p{margin:0 0 14px;font-size:clamp(.9rem,1.8vw,1.05rem);line-height:1.45;color:#fff}
.hero-in .btn{background:#fff;color:#12306b;border-color:#fff;text-shadow:none}
details.vz{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:8px;background:var(--bg)}
details.vz summary{cursor:pointer}
.box a{color:var(--acc);text-underline-offset:2px}
.box a.btn{color:var(--acc-ink);text-decoration:none}
.box a.btn.ghost{color:var(--acc)}
.pw{position:relative;display:block}
.pw input{padding-right:44px;width:100%;box-sizing:border-box}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--mute);cursor:pointer;border-radius:6px}
.pw button:hover,.pw button:focus-visible{color:var(--acc);background:var(--soft)}
.scope{border:2px solid var(--acc);background:var(--soft);border-radius:8px;padding:12px 16px;margin:0 0 16px}
.scope strong{display:block;margin-bottom:4px}
.scope p{margin:0;font-size:.92rem;line-height:1.5}
.btn.xs{padding:5px 10px;font-size:.78rem;display:inline-block}
.bkrow{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.bkrow .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:20;max-width:calc(100vw - 32px)}
@media (max-width:780px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .step{border-left:0;border-bottom:2px solid var(--line);white-space:nowrap;flex:0 0 auto}
  .step[aria-current="step"]{border-bottom-color:var(--acc)}
  section.panel{padding:18px}
  .fr{grid-template-columns:minmax(0,1fr) 64px 56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
//ENGINE_START
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const EDU={none:0,assoc:1,bach:2,mast:3,phd:4};
const ENG={none:0,basic:1,mid:2,good:3,fluent:4};
const HOT=['tech','health','eng','fin'];
const F=(k,pts,max)=>({k,pts:Math.round(pts),max});
function finish(f,cap,capKey,branch){
  const raw=f.reduce((a,x)=>a+x.pts,0);
  let s=raw; if(cap!=null) s=Math.min(s,cap);
  s=clamp(Math.round(s),3,90);
  return {score:s,factors:f,capKey:capKey||null,branch:branch||null};
}
const refusal=(p,n)=>p.refusal==='yes'?[F('f_refusal',-n,0)]:[];
function scoreH1B(p){
  const e=EDU[p.edu];
  const f=[F('f_edu',[0,4,18,26,30][e],30),F('f_exp',Math.min(p.exp,8)*2,16),
    F('f_offer',{none:0,talk:8,offer:25}[p.offer],25),F('f_eng',ENG[p.eng]*2,8),
    F('f_field',HOT.includes(p.field)?8:3,8),F('f_abroad',{none:0,visit:2,short:3,long:4}[p.abroad],4),...refusal(p,12)];
  if(e<2) return finish(f,12,'cap_h1b_edu');
  if(p.offer!=='offer') return finish(f,35,'cap_h1b_offer');
  return finish(f);
}
function scoreO1(p){
  const f=[F('f_achv',{none:0,local:12,nat:30,intl:46}[p.achv],46),F('f_exp',Math.min(p.exp,10)*1.5,15),
    F('f_edu',[0,2,5,8,10][EDU[p.edu]],10),F('f_offer',{none:0,talk:6,offer:14}[p.offer],14),
    F('f_eng',ENG[p.eng]*1.5,6),F('f_field',['tech','health','eng','creative'].includes(p.field)?4:2,4),...refusal(p,10)];
  return p.achv==='none'?finish(f,12,'cap_o1_achv'):finish(f);
}
function scoreL1(p){
  const f=[F('f_intl',{none:2,plan:22,yes:52}[p.intl],52),F('f_exp',Math.min(p.exp,10)*1.2,12),
    F('f_edu',[0,1,4,6,8][EDU[p.edu]],8),F('f_eng',ENG[p.eng]*1.5,6),...refusal(p,10)];
  if(p.intl==='none') return finish(f,10,'cap_l1');
  if(p.intl==='plan') return finish(f,45,'cap_l1_plan');
  return finish(f);
}
function scoreE2(p){
  const f=[F('f_funds',{none:0,lt50:10,mid:26,hi:42,top:52}[p.funds],52),F('f_treaty',15,15),
    F('f_exp',Math.min(p.exp,10)*1.2,12),F('f_eng',ENG[p.eng]*1.5,6),...refusal(p,10)];
  return p.funds==='none'?finish(f,10,'cap_e2'):finish(f);
}
function scoreF1(p){
  const f=[F('f_admit',{none:0,applied:14,admitted:40}[p.usAdmit],40),F('f_eng',ENG[p.eng]*4,16),
    F('f_funds',{none:0,lt50:6,mid:14,hi:20,top:22}[p.funds],22),F('f_edu',[4,6,8,8,8][EDU[p.edu]],8),
    F('f_abroad',{none:0,visit:3,short:4,long:5}[p.abroad],5),...refusal(p,15)];
  return p.usAdmit==='none'?finish(f,15,'cap_f1'):finish(f);
}
function scoreGC(p){
  const emp=[F('f_offer',{none:0,talk:6,offer:28}[p.offer],28),F('f_edu',[0,2,8,13,16][EDU[p.edu]],16),
    F('f_exp',Math.min(p.exp,8)*2,16),F('f_achv',{none:0,local:3,nat:10,intl:20}[p.achv],20),F('f_eng',ENG[p.eng]*1.5,6)];
  const empSum=emp.reduce((a,x)=>a+x.pts,0);
  const famPts={none:0,other:30,imm:70}[p.fam];
  if(famPts>=empSum && famPts>0){
    return finish([F('f_fam',famPts,70),F('f_eng',ENG[p.eng]*2,8)],null,null,'br_fam');
  }
  const weak=p.offer!=='offer'&&p.achv==='none';
  return finish(emp,weak?20:null,weak?'cap_gc':null,'br_emp');
}
const CALC={h1b:scoreH1B,o1:scoreO1,l1:scoreL1,e2:scoreE2,f1:scoreF1,gc:scoreGC};
const PATHS=['h1b','o1','l1','e2','f1','gc'];
const DEMAND={tech:'hi',health:'hi',eng:'hi',fin:'mid',edu:'mid',creative:'mid',trades:'hi',other:'low'};
function scoreJob(p){
  const f=[F('f_demand',{hi:14,mid:8,low:3}[DEMAND[p.field]],14),F('f_exp',Math.min(p.exp,10)*1.8,18),
    F('f_edu',[0,2,6,9,10][EDU[p.edu]],10),F('f_cred',EDU[p.edu]>=2?{no:0,plan:4,done:12}[p.cred]:0,12),
    F('f_eng',ENG[p.eng]*3.5,14),F('f_abroad',{none:0,visit:1,short:2,long:4}[p.abroad],4),
    F('f_net',{none:0,some:6,strong:12}[p.net],12),F('f_cv',{no:0,draft:3,ready:8}[p.cv],8),
    F('f_cert',p.cert?4:0,4)];
  return p.auth==='none'?finish(f,40,'cap_job_auth'):finish(f);
}
const level=s=>s>=70?4:s>=50?3:s>=25?2:1;
//ENGINE_END

const L={
tr:{
 tag:'Türkiye’den ABD’ye hazırlık rehberi',
 stamp:'Önemli',
 disc:'Bu site hukuki veya göçmenlik danışmanlığı değildir. Skorlar, girdiğin bilgilere göre hesaplanan hazırlık göstergesidir; vize ya da iş onayı olasılığı değildir. Kararı konsolosluk ve USCIS verir. Kurallar sık değişir.',
 priv:'Profil bilgilerin bu tarayıcıda kalır. Hesap açarsan, talep kaydeder veya belge yüklersen bunlar özel bir sunucuda (Supabase) saklanır.',
 s1:'Profil',s2:'Vize hazırlığı',s3:'İş bulma',s4:'Çalışma izni',s5:'Kariyer',
 h1:'Profilini doldur',i1:'Eğitim, deneyim ve durumuna göre altı yol için hazırlık skoru hesaplanır. Alanlar örnek değerlerle açıldı; kendi bilgilerinle değiştir. Bilmediğini boş ya da “Yok” bırak.',
 g1:'Eğitim ve iş',g2:'Dil ve seyahat',g3:'Yol bazlı durumlar',
 see:'Skorları gör',reset:'Örnek değerlere dön',back:'Geri',next:'Devam',
 h2:'Vize yolları için hazırlık skorun',i2:'Altı yol, girdiklerine göre sıralandı. Skor 90’ı geçmez; hiçbir skor onay anlamına gelmez. Satıra dokunarak hesabı ve süreci aç.',
 best:'En yüksek hazırlık',how:'Nasıl hesaplandı',proc:'Süreç',watch:'Dikkat',
 lv1:'başlangıç',lv2:'gelişmeli',lv3:'orta',lv4:'güçlü',

function setStep(n){

  document.querySelectorAll('.step').forEach((el,i)=>{if(i+1===n)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});
  const sh=document.querySelector('.shell');if(sh)window.scrollTo({top:Math.max(0,sh.getBoundingClientRect().top+window.pageYOffset-8)});else window.scrollTo({top:0});
}

  if(b.dataset.go){setStep(+b.dataset.go);}
  else if(b.dataset.lang){lang=b.dataset.lang;save();shell();}
  else if(b.dataset.reset){const chk=p.chk;p=Object.assign({},DEF,{chk});save();shell();}
  else if(b.dataset.copy){
    const txt=document.getElementById('b_out').textContent;
    const ok=()=>{b.textContent=t('copied');setTimeout(()=>{b.textContent=t('copy');},1400);};
    try{navigator.clipboard.writeText(txt).then(ok,()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('b_out'));const s=getSelection();s.removeAllRanges();s.addRange(r);});}
    catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById('b_out'));const s=getSelection();s.removeAllRanges();s.addRange(r);}
  }
});

}

const sameTZ=()=>new Date().getTimezoneOffset()===-180;

function dayLabel(ds){const d=new Date(Date.UTC(+ds.slice(0,4),+ds.slice(4,6)-1,+ds.slice(6,8)));return d.toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});}
function trStamp(ms){const d=new Date(ms+TR_OFF*3600e3);return `${pad(d.getUTCDate())}.${pad(d.getUTCMonth()+1)}.${d.getUTCFullYear()} ${pad(d.getUTCHours())}:00`;}
const locStamp=ms=>new Date(ms).toLocaleString(loc(),{weekday:'short',hour:'2-digit',minute:'2-digit'});
function weekendDays(weeks){
  const out=[],n=new Date(Date.now()+TR_OFF*3600e3),y=n.getUTCFullYear(),m=n.getUTCMonth(),d=n.getUTCDate();
  for(let i=0;i<(weeks||8)*7;i++){
    const day=new Date(Date.UTC(y,m,d+i)),wd=day.getUTCDay();
    if(wd!==6&&wd!==0)continue;
    const ds=`${day.getUTCFullYear()}${pad(day.getUTCMonth()+1)}${pad(day.getUTCDate())}`;
    out.push({ds,hours:HOURS.map(h=>({h,s:Date.UTC(day.getUTCFullYear(),day.getUTCMonth(),day.getUTCDate(),h-TR_OFF)}))});
  }
  return out;
}

/* slot ownership: earliest valid claim wins; unpaid claims lapse after 48 h */
function winner(id){
  const now=Date.now(),c=[];
  for(const uid in S.claims){const s=S.claims[uid]&&S.claims[uid].slots&&S.claims[uid].slots[id];if(s)c.push(Object.assign({uid},s));}
  const valid=c.filter(x=>{const py=S.pay[x.uid+'~'+id];if(py&&py.cancelled)return false;if(py&&py.confirmed)return true;if(x.claimed)return true;return x.at+HOLD_MS>now;});
  valid.sort((a,b)=>{const pa=S.pay[a.uid+'~'+id],pb=S.pay[b.uid+'~'+id];const ca=pa&&pa.confirmed?0:1,cb=pb&&pb.confirmed?0:1;return ca-cb||a.at-b.at;});
  return valid[0]||null;
}
function slotState(id){
  if(S.avail[id]&&S.avail[id].blocked)return 'blocked';
  const w=winner(id);if(!w)return 'free';
  return w.uid===MY?'mine':'taken';
}
function statusFor(uid,id,it){
  const py=S.pay[uid+'~'+id];
  if(py&&py.cancelled)return 'cancel';
  if(py&&py.confirmed)return 'ok';
  const w=winner(id);
  if(!w||w.uid!==uid)return it.at+HOLD_MS<Date.now()?'expired':'lost';
  const c=S.claims[uid]&&S.claims[uid].slots&&S.claims[uid].slots[id];
  return c&&c.claimed?'claimed':'pending';
}
const chipCls=s=>s==='ok'?'ok':(s==='pending'||s==='claimed')?'wait':'bad';
const feeUSD=cal=>cal==='a'?(S.cfg.usdAtt||100):(S.cfg.usd||100);
const fmtIban=s=>String(s||'').replace(/\s/g,'').replace(/(.{4})/g,'$1 ').trim();
function ibanOK(s){
  s=String(s).replace(/\s/g,'').toUpperCase();
  if(!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(s))return false;
  const r=s.slice(4)+s.slice(0,4);let rem=0;
  for(const ch of r){const v=/\d/.test(ch)?ch:String(ch.charCodeAt(0)-55);for(const d of v)rem=(rem*10+Number(d))%97;}
  return rem===1;
}

    if(!hrs.length)return '';
    const btns=hrs.map(x=>{
      const id=sid(cal,day.ds,x.h),st=slotState(id),lab=`${pad(x.h)}:00`;
      if(mode==='staff')return `<button class="slot ${st}" data-a="toggle" data-id="${id}" title="${t(st)}">${lab}</button>`;

      return `<button class="slot ${st}" disabled title="${t(st)}">${lab}</button>`;
    }).join('');
    const first=hrs[0].s,last=hrs[hrs.length-1].s;

    return `<div class="day"><h3>${dayLabel(day.ds)}</h3>${lc}<div class="slots">${btns}</div></div>`;

}

const schedule=()=>{if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;renderLive(false);});};

function saveDos(mut,delay){
  const d=clone(S.mydos||{track:'tr',checks:{},notes:'',cases:[]});
  mut(d);d.updatedAt=Date.now();S.mydos=d;
  clearTimeout(dosTimer);
  dosTimer=setTimeout(()=>{dosTimer=null;enq(()=>DB.doc('dos/'+MY).set(S.mydos));},delay||0);
}
async function doBook(p0,nm,ct){
  const r=await DB.doc('locks/'+p0.id).acquire({holder:MY,ttlMs:8000});
  if(!r.acquired){toast(t('busy'));return;}
  const snap=await DB.collection('claims').get();
  const fresh={};snap.docs.forEach(d=>{fresh[d.id]=d.data();});S.claims=fresh;
  const w=winner(p0.id);
  if(w&&w.uid!==MY){toast(t('gone'));pick=null;renderLive(true);return;}
  const cl=clone(S.claims[MY]||{slots:{}});cl.slots=cl.slots||{};
  cl.slots[p0.id]={cal:p0.cal,at:Date.now(),start:p0.s,claimed:null};
  await DB.doc('claims/'+MY).set(cl);
  const bk=clone(S.mybk||{items:{}});bk.items=bk.items||{};bk.name=nm;bk.contact=ct;
  bk.items[p0.id]={cal:p0.cal,start:p0.s,topic:draft.topic.trim(),at:Date.now(),ref:refCode(p0.id)};
  await DB.doc('bk/'+MY).set(bk);
  S.claims[MY]=cl;S.mybk=bk;pick=null;draft.topic='';toast(t('booked'));renderLive(true);
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,id=b.dataset.id,uid=b.dataset.uid;
  const val=i=>{const el=document.getElementById(i);return el?el.value:'';};
  if(a==='pick'){pick={cal:b.dataset.cal,id,s:Number(b.dataset.s)};renderLive(true);setTimeout(()=>{const f=document.getElementById('x_name');if(f)f.focus();},30);}
  else if(a==='unpick'){pick=null;renderLive(true);}
  else if(a==='book'){
    if(!pick)return;const nm=draft.name.trim(),ct=draft.contact.trim();
    if(!nm||!ct){toast(t('fillall'));return;}
    const p0=pick;enq(()=>doBook(p0,nm,ct));
  }
  else if(a==='claim'){
    const sender=val('x_sender_'+id).trim();
    enq(async()=>{
      const cl=clone(S.claims[MY]||{slots:{}});
      if(cl.slots&&cl.slots[id]){cl.slots[id].claimed=Date.now();await DB.doc('claims/'+MY).set(cl);}
      const bk=clone(S.mybk);if(bk&&bk.items&&bk.items[id]){bk.items[id].claimedAt=Date.now();bk.items[id].sender=sender;await DB.doc('bk/'+MY).set(bk);}
    });
  }
  else if(a==='cancelbk'){
    enq(async()=>{
      const cl=clone(S.claims[MY]||{slots:{}});if(cl.slots)delete cl.slots[id];await DB.doc('claims/'+MY).set(cl);
      const bk=clone(S.mybk||{items:{}});if(bk.items)delete bk.items[id];await DB.doc('bk/'+MY).set(bk);
    });
  }
  else if(a==='copy'){
    const v=b.dataset.v;
    try{navigator.clipboard.writeText(v).then(()=>toast(t('copied2')),()=>toast(v));}catch(err){toast(v);}
  }
  else if(a==='track'){saveDos(d=>{d.track=b.dataset.v;},0);renderLive(true);}
  else if(a==='addcase'){
    const rc=val('x_rc').toUpperCase().replace(/[\s-]/g,'');
    if(!/^[A-Z]{3}\d{10}$/.test(rc)){toast(t('cs_bad'));return;}
    saveDos(d=>{d.cases=d.cases||[];d.cases.push({id:'c'+Date.now().toString(36),receipt:rc,form:val('x_fm'),filed:val('x_fd'),hist:[]});},0);renderLive(true);
  }
  else if(a==='addhist'){
    const box=b.closest('.case'),s=box.querySelector('.h-s').value,d0=box.querySelector('.h-d').value||new Date().toISOString().slice(0,10),n=box.querySelector('.h-n').value.trim();
    saveDos(d=>{const c=(d.cases||[]).find(x=>x.id===id);if(c){c.hist=c.hist||[];c.hist.push({d:d0,s,n});}},0);renderLive(true);
  }
  else if(a==='delask'){delAsk=id;renderLive(true);}
  else if(a==='delno'){delAsk=null;renderLive(true);}
  else if(a==='delcase'){delAsk=null;saveDos(d=>{d.cases=(d.cases||[]).filter(x=>x.id!==id);},0);renderLive(true);}
  else if(a==='confirm'){enq(()=>DB.doc('pay/'+uid+'~'+id).set({confirmed:true,at:Date.now()}));}
  else if(a==='cancelpay'){enq(()=>DB.doc('pay/'+uid+'~'+id).set({cancelled:true,at:Date.now()}));}
  else if(a==='toggle'){
    const blocked=S.avail[id]&&S.avail[id].blocked;
    enq(()=>blocked?DB.doc('avail/'+id).delete():DB.doc('avail/'+id).set({blocked:true}));
  }
  else if(a==='savecfg'){
    const iban=val('x_iban').replace(/\s/g,'').toUpperCase();
    if(iban&&!ibanOK(iban)){cfgMsg=t('ad_badiban');renderLive(true);return;}
    enq(async()=>{await DB.doc('cfg/pay').set({iban,holder:val('x_holder').trim(),bank:val('x_bank').trim(),usd:Number(val('x_usd'))||100,usdAtt:Number(val('x_usdAtt'))||100,tryRate:Number(val('x_rate'))||0});cfgMsg=t('ad_saved');renderLive(true);});
  }
  else if(a==='savestf'){
    enq(()=>DB.doc('stf/'+uid).set({note:val('x_sn_'+uid).trim(),caseStatus:val('x_sc_'+uid).trim(),at:Date.now()}));toast(t('ad_saved'));
  }
});
app.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f){draft[el.dataset.f]=el.value;}
  else if(el.dataset.d&&DB){const k=el.dataset.d,v=el.value;saveDos(d=>{d[k]=v;},600);}
});
app.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.ck&&DB){const k=el.dataset.ck,v=el.checked;saveDos(d=>{d.checks=d.checks||{};d.checks[k]=v;},0);renderLive(true);}
  else if(el.dataset.d==='key'&&DB){const v=el.value;saveDos(d=>{d.key=v;},0);renderLive(true);}
});

async function initDb(){
  try{
    if(!window.claude||!window.claude.use){LOADING=false;renderLive(true);return;}
    const [dbm,um]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!dbm||!um){LOADING=false;renderLive(true);return;}
    MY=await um.id();
    const can=await um.can('data.write');
    if(!MY||can===false){LOADING=false;renderLive(true);return;}
    DB=dbm;LOADING=false;
    const coll=(path,key)=>DB.collection(path).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data();});S[key]=o;schedule();},()=>{});
    const one=(path,key,guard)=>DB.doc(path).onSnapshot(s=>{if(guard&&guard())return;S[key]=s.data()||(key==='cfg'?{}:null);schedule();},()=>{});
    coll('claims','claims');coll('pay','pay');coll('avail','avail');
    one('cfg/pay','cfg');one('bk/'+MY,'mybk');one('dos/'+MY,'mydos',()=>!!dosTimer);one('stf/'+MY,'mystf');
    if(await um.canEdit()){
      coll('bk','allbk');coll('dos','alldos');coll('stf','allstf');
      STAFF=true;shell();
    }
    renderLive(true);
  }catch(err){LOADING=false;DB=null;renderLive(true);}
}

const MON='(?:ocak|şubat|subat|mart|nisan|mayıs|mayis|haziran|temmuz|ağustos|agustos|eylül|eylul|ekim|kasım|kasim|aralık|aralik|jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
const DT='(?:'+MON+'\\.?\\s*\\d{4}|\\d{1,2}[./]\\d{4}|\\d{4}[./-](?:0?[1-9]|1[0-2])(?!\\d)|\\d{4})';
const NOWW='(?:present|current|now|halen|günümüz|gunumuz|devam(?:\\s*ediyor)?|şu\\s*an|su\\s*an|bugün)';
const MMAP={oca:1,jan:1,şub:2,sub:2,feb:2,mar:3,nis:4,apr:4,may:5,haz:6,jun:6,tem:7,jul:7,ağu:8,agu:8,aug:8,eyl:9,sep:9,eki:10,oct:10,kas:11,nov:11,ara:12,dec:12};
function parseDT(s,isEnd,nowD){
  s=String(s).toLowerCase().trim();
  if(new RegExp('^'+NOWW+'$','i').test(s))return {y:nowD.getFullYear(),m:nowD.getMonth()+1,open:true};
  const y=+(/\d{4}/.exec(s)||[])[0];if(!y)return null;
  let m=null,mm;
  if((mm=/^([a-zçğıöşü]+)/.exec(s))){m=MMAP[mm[1].slice(0,3)]||null;}
  else if((mm=/^(\d{1,2})[./]\d{4}/.exec(s))){m=+mm[1];}
  else if((mm=/^\d{4}[./-](\d{1,2})/.exec(s))){m=+mm[1];}
  if(!m)m=isEnd?12:1;
  if(isEnd&&y===nowD.getFullYear()&&m>nowD.getMonth()+1)m=nowD.getMonth()+1;
  return {y,m};
}
function findRanges(line,nowD){
  const re=new RegExp('('+DT+')\\s*(?:-|–|—|to|until|ila)\\s*('+DT+'|'+NOWW+')','ig'),out=[];let r;
  while((r=re.exec(line))){
    const a=parseDT(r[1],false,nowD),b=parseDT(r[2],true,nowD);
    if(a&&b&&a.y>=1960&&a.y<=nowD.getFullYear()+1&&(b.y*12+b.m)>=(a.y*12+a.m))out.push({a,b,raw:r[0],idx:r.index});
  }
  return out;
}
const pm=n=>String(n).padStart(2,'0');
const ym=d=>d.y+'-'+pm(d.m);
function sectionsOf(lines){
  const H={exp:/^(i̇ş deneyimi|iş deneyimi|is deneyimi|deneyim|work experience|professional experience|experience|employment(?: history)?|çalışma geçmişi|calisma gecmisi)\s*:?$/i,
    edu:/^(eğitim|egitim|eğitim bilgileri|education|academic background|academic)\s*:?$/i,
    other:/^(skills|beceriler|yetenekler|languages|diller|yabancı dil|projects|projeler|certificates?|sertifikalar|references|referanslar|interests|ilgi alanları|hobiler|summary|özet|profile|profil|hakkımda|about me|awards|ödüller|publications|yayınlar|courses|kurslar)\s*:?$/i};
  const sec={exp:[],edu:[],rest:[]};let cur='rest';
  lines.forEach(l=>{
    const t0=l.trim();
    if(t0.length<=40){
      if(H.exp.test(t0)){cur='exp';return;}
      if(H.edu.test(t0)){cur='edu';return;}
      if(H.other.test(t0)){cur='rest';return;}
    }
    sec[cur].push(l);
  });
  return sec;
}
function parseCV(text,nowD){
  nowD=nowD||new Date();
  const lines=String(text).replace(/\r/g,'\n').split('\n').map(l=>l.replace(/[ \t]+/g,' ').trim()).filter(Boolean);
  const all=lines.join('\n'),sec=sectionsOf(lines);
  const found={},hist={work:[],edu:[]};
  // work entries
  const workLines=sec.exp.length?sec.exp:lines.filter(l=>!sec.edu.includes(l));
  const seen=new Set();
  workLines.forEach((l,i)=>{
    findRanges(l,nowD).forEach(r=>{
      if(/üniversite|university|lise\b|high school|okul\b|college/i.test(l)&&!sec.exp.length)return;
      let head=(l.slice(0,r.idx)+' '+l.slice(r.idx+r.raw.length)).replace(/[|•·()]/g,' ').replace(/\s+/g,' ').trim();
      if(head.length<3)head=(workLines[i-1]||'').trim();
      let title=head,org='';
      const sp=head.split(/\s+(?:-|–|—|\||@|at)\s+|,\s+/);
      if(sp.length>=2){title=sp[0];org=sp[1];}
      const key=(title+org+ym(r.a)).toLowerCase();if(seen.has(key))return;seen.add(key);
      hist.work.push({title:title.slice(0,80),org:org.slice(0,80),from:ym(r.a),to:r.b.open?'':ym(r.b)});
    });
  });
  // years of experience: union of months
  const ivs=hist.work.map(w=>{const a=+w.from.slice(0,4)*12+ +w.from.slice(5)-1;const b=w.to?+w.to.slice(0,4)*12+ +w.to.slice(5)-1:nowD.getFullYear()*12+nowD.getMonth();return [a,b];}).sort((x,y)=>x[0]-y[0]);
  let months=0,end=-1;ivs.forEach(([a,b])=>{if(b<=end)return;months+=b-Math.max(a,end+1)+1;end=b;});
  const phrase=/(\d{1,2})\s*\+?\s*(?:years?|yıl|yil)\b[^.\n]{0,25}(?:experience|deneyim|tecrübe)/i.exec(all);
  if(hist.work.length){found.exp={v:Math.min(40,Math.round(months/12)),ev:hist.work.length+' kayıt, '+months+' ay'};}
  else if(phrase){found.exp={v:Math.min(40,+phrase[1]),ev:phrase[0]};}
  // education entries
  sec.edu.forEach((l,i)=>{
    findRanges(l,nowD).forEach(r=>{
      let head=(l.slice(0,r.idx)+' '+l.slice(r.idx+r.raw.length)).replace(/[|•·()]/g,' ').replace(/\s+/g,' ').trim();
      if(head.length<3)head=(sec.edu[i-1]||'').trim();
      let school=head,degree='';
      const sp=head.split(/\s+(?:-|–|—|\|)\s+|,\s+/);
      if(sp.length>=2){school=sp[0];degree=sp[1];}
      hist.edu.push({school:school.slice(0,80),degree:degree.slice(0,80),from:ym(r.a),to:ym(r.b)});
    });
  });
  // education level
  const eduText=sec.edu.length?sec.edu.join('\n'):all.replace(/scrum master|master data|webmaster|web master|master chef|master of ceremon\w*/ig,' ');
  let lv=null,ev='',low=false,mm;
  if((mm=/\b(ph\.?d|doctorate|doktora)\b/i.exec(eduText))){lv='phd';ev=mm[0];}
  else if((mm=/\b(m\.?sc|master'?s?|mba|yüksek lisans|yuksek lisans)\b/i.exec(eduText))){lv='mast';ev=mm[0];}
  else if((mm=/\b(bachelor'?s?|b\.?sc|bsc|b\.a\.|b\.s\.|lisans(?!üstü)|undergraduate|mühendisliği|mühendislik fakültesi)\b/i.exec(eduText))){lv='bach';ev=mm[0];}
  else if((mm=/\b(associate|önlisans|on lisans|ön lisans|meslek yüksekokulu|myo)\b/i.exec(eduText))){lv='assoc';ev=mm[0];}
  else if((mm=/üniversite|university|college/i.exec(eduText))){lv='bach';ev=mm[0];low=true;}
  else if((mm=/\b(lise|high school)\b/i.exec(eduText))){lv='none';ev=mm[0];}
  if(lv)found.edu={v:lv,ev,low};
  // field
  const KW={
   tech:/software|developer|yazılım|programmer|devops|data scientist|veri bilim|front.?end|back.?end|full.?stack|javascript|python|\bsql\b|cloud|bilgisayar mühendis|computer engineer|information technology|bilişim/ig,
   health:/\bnurse|hemşire|physician|doktor|hekim|dentist|diş hekim|pharmac|eczac|physiotherap|fizyoterap|clinic|klinik|hospital|hastane|medical|\btıp\b/ig,
   eng:/civil engineer|inşaat mühendis|mechanical|makine mühendis|electrical engineer|elektrik mühendis|industrial engineer|endüstri mühendis|autocad|solidworks|mühendis\b/ig,
   fin:/financ|finans|accountant|muhasebe|\baudit|denetim|\bbank|banka|\bcpa\b|\bcfa\b|treasury|investment|yatırım/ig,
   edu:/teacher|öğretmen|lecturer|akademisyen|professor|profesör|research assistant|araştırma görevlisi/ig,
   creative:/designer|tasarımcı|\bux\b|graphic|grafik|architect|mimar|video editor|editör|photograph|fotoğraf|\bwriter\b|\byazar\b|illustrat/ig,
   trades:/electrician|elektrikçi|plumber|tesisat|welder|kaynakçı|technician|teknisyen|\bchef\b|aşçı|mechanic|tamirci|carpenter|marangoz/ig};
  let best=null,bc=0;
  Object.keys(KW).forEach(k=>{const c=(all.match(KW[k])||[]).length;if(c>bc){bc=c;best=k;}});
  if(best)found.field={v:best,ev:bc+' eşleşme'};
  // english
  let eng=null,eev='';
  const el=lines.filter(l=>/english|ingilizce/i.test(l)||/ielts|toefl/i.test(l));
  const ej=el.join(' ');
  if((mm=/ielts[^0-9]{0,15}([0-9](?:\.[0-9])?)/i.exec(all))){const s=+mm[1];eng=s>=8?'fluent':s>=7?'good':s>=5.5?'mid':s>=4?'basic':'none';eev=mm[0];}
  else if((mm=/toefl[^0-9]{0,20}(\d{2,3})/i.exec(all))){const s=+mm[1];eng=s>=105?'fluent':s>=90?'good':s>=72?'mid':s>=42?'basic':'none';eev=mm[0];}
  else if(ej){
    if((mm=/\b(c2|native|mother tongue|anadil|fluent|akıcı|proficient)\b/i.exec(ej))){eng='fluent';eev=mm[0];}
    else if((mm=/\b(c1|advanced|ileri)\b/i.exec(ej))){eng='good';eev=mm[0];}
    else if((mm=/\b(b2|upper.?intermediate|intermediate|orta)\b/i.exec(ej))){eng='mid';eev=mm[0];}
    else if((mm=/\b(b1|basic|temel|elementary)\b/i.exec(ej))){eng='basic';eev=mm[0];}
    else if((mm=/\b(a1|a2|beginner|başlangıç)\b/i.exec(ej))){eng='none';eev=mm[0];}
  }
  if(eng)found.eng={v:eng,ev:eev};
  // school/major line
  const sl=(sec.edu.length?sec.edu:lines).find(l=>/üniversite|university|college/i.test(l));
  if(sl)found.major={v:sl.replace(/\s+/g,' ').slice(0,80),ev:''};
  return {found,hist};
}

/* ---------- history state and gaps ---------- */
const HK=['addr','work','edu','us','intl'];
const HH=()=>p.hist||(p.hist={addr:[],work:[],edu:[],us:[],intl:[]});
const HCOLS={
 addr:[['line','h_line','text'],['from','h_from','month'],['to','h_to','month']],
 work:[['title','h_title','text'],['org','h_org','text'],['from','h_from','month'],['to','h_to','month']],
 edu:[['school','h_school','text'],['degree','h_degree','text'],['from','h_from','month'],['to','h_to','month']],
 us:[['from','h_from','date'],['to','h_to','date'],['note','h_note','text']],
 intl:[['country','h_country','text'],['from','h_from','date'],['to','h_to','date']]
};
const mIdx=s=>{const m=/^(\d{4})-(\d{2})/.exec(s||'');return m?(+m[1])*12+(+m[2])-1:null;};
const mLabel=i=>Math.floor(i/12)+'-'+pad(i%12+1);
function gapsOf(list){
  const n=new Date(),cur=n.getFullYear()*12+n.getMonth(),lo=cur-60,cov=new Set();
  list.forEach(e=>{let a=mIdx(e.from);if(a==null)return;let b=e.to?mIdx(e.to):cur;if(b==null)b=cur;a=Math.max(a,lo);b=Math.min(b,cur);for(let i=a;i<=b;i++)cov.add(i);});
  const out=[];let st=null;
  for(let i=lo;i<=cur;i++){if(!cov.has(i)){if(st==null)st=i;}else if(st!=null){out.push([st,i-1]);st=null;}}
  if(st!=null)out.push([st,cur]);
  return out;
}
function gapHTML(){
  const h=HH();
  const one=(k,title)=>{
    if(!h[k].length)return `<li><b>${t(title)}:</b> ${t('gap_empty')}</li>`;
    const g=gapsOf(h[k]);
    return g.length?`<li class="cap"><b>${t(title)}:</b> ${t('gap_warn')}: ${g.map(x=>mLabel(x[0])+' → '+mLabel(x[1])).join(', ')}. ${t('gap_fix')}</li>`:`<li><b>${t(title)}:</b> ${t('gap_ok')}</li>`;
  };
  const last2=h.work.slice().sort((a,b)=>String(b.from).localeCompare(String(a.from))).slice(0,2);
  return `<ul class="tight" style="list-style:none;padding:0">${one('addr','hl_addr')}${one('work','hl_work')}</ul>
   ${last2.length?`<h4>${t('ds_two')}</h4><ul class="tight">${last2.map(w=>`<li>${esc(w.title)}${w.org?' · '+esc(w.org):''} <span class="mono sm">${esc(w.from)} → ${esc(w.to||'…')}</span></li>`).join('')}</ul>`:''}`;
}
function histRows(k){
  return HH()[k].map((e,i)=>`<div class="hrow" data-l="${k}" data-i="${i}">${HCOLS[k].map(c=>`<label class="fld"><span>${t(c[1])}</span><input type="${c[2]==='text'?'text':c[2]}" data-h="${c[0]}" ${c[2]==='month'?'placeholder="YYYY-MM"':''} maxlength="90" value="${esc(e[c[0]]||'')}"></label>`).join('')}<button class="btn ghost xs" data-a="hdel" data-l="${k}" data-i="${i}">${t('h_del')}</button></div>`).join('');
}
function renderHist(){
  const el=document.getElementById('histbox');if(!el)return;
  el.innerHTML=`<div class="box" style="margin-top:24px"><h3>${t('hist_h')}</h3><p class="sm" style="margin-top:6px">${t('hist_i')}</p><p class="sm">${t('hist_src')}</p>
   ${HK.map(k=>`<h4>${t('hl_'+k)}</h4>${histRows(k)}<button class="btn ghost xs" data-a="hadd" data-l="${k}">${t('h_add')}</button>`).join('')}
   <div id="gapbox" style="margin-top:16px">${gapHTML()}</div>
   <div style="margin-top:12px"><button class="btn ghost xs" data-a="hsum">${t('hsum')}</button></div></div>`;
}
function histSummary(){
  const h=HH(),lines=[];
  const fmt=(k,f)=>h[k].slice().sort((a,b)=>String(a.from).localeCompare(String(b.from))).map(f).join('\n')||'-';
  lines.push(t('hl_addr')+':\n'+fmt('addr',e=>`${e.from} → ${e.to||'…'}  ${e.line}`));
  lines.push(t('hl_work')+':\n'+fmt('work',e=>`${e.from} → ${e.to||'…'}  ${e.title}${e.org?', '+e.org:''}`));
  lines.push(t('hl_edu')+':\n'+fmt('edu',e=>`${e.from} → ${e.to||'…'}  ${e.school}${e.degree?', '+e.degree:''}`));
  lines.push(t('hl_us')+':\n'+fmt('us',e=>`${e.from} → ${e.to||''}  ${e.note||''}`));
  lines.push(t('hl_intl')+':\n'+fmt('intl',e=>`${e.from} → ${e.to||''}  ${e.country}`));
  return lines.join('\n\n');
}

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function readFile(f){
  const n=f.name.toLowerCase();
  if(n.endsWith('.txt'))return await f.text();
  const buf=await f.arrayBuffer();
  if(n.endsWith('.docx')){
    if(!window.mammoth)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await window.mammoth.extractRawText({arrayBuffer:buf})).value;
  }
  if(n.endsWith('.pdf')){
    if(!window.pdfjsLib)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc=await window.pdfjsLib.getDocument({data:buf}).promise;let out='';
    for(let i=1;i<=doc.numPages;i++){
      const pg=await doc.getPage(i),tc=await pg.getTextContent();let y=null,line='';
      tc.items.forEach(it=>{const yy=Math.round(it.transform[5]);if(y!==null&&Math.abs(yy-y)>3){out+=line.trim()+'\n';line='';}y=yy;line+=it.str+' ';});
      out+=line.trim()+'\n';
    }
    return out;
  }
  throw new Error('type');
}
function setMsg(m){cvMsg=m;const e=document.getElementById('cvmsg');if(e)e.textContent=m;}
function markNeed(ids,on){ids.forEach(id=>{const c=document.getElementById('f_'+id);const lab=c&&c.closest('.fld');if(lab)lab.classList.toggle('need',on);});}

    else miss.push(k);

  markNeed(['edu','field','exp','eng','major'],false);
  markNeed(miss.filter(k=>k!=='major'),true);
  markNeed(['abroad','refusal','offer','achv','intl','funds','usAdmit','fam'],true);
  save();renderRes2();renderRes3();renderRes4();setMsg(t('cv_done'));
}

app.addEventListener('click',async e=>{

      if(fi&&fi.files&&fi.files[0]){setMsg(t('cv_reading'));txt=await readFile(fi.files[0]);}

let SB=null,SBU=null,SBROLE='client',SBST={reqs:[],docs:[],names:{},msg:'',mode:'in',email:'',name:'',busy:false,consent:false};
const isUUID=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v||'');
function sbMsg(m){SBST.msg=m;sbRender();}
async function sbAttorneys(){
  if(!SB)return;
  const {data,error}=await SB.from('attorneys').select('*');
  if(error||!data)return;
  ATTORNEYS.length=0;
  data.forEach(r=>ATTORNEYS.push({id:r.id,first:r.first_name,last:r.last_name,city:r.city,state:r.state,barState:r.bar_state,barNo:r.bar_no,verifiedOn:r.verified_on,verifySrc:r.verify_src,langs:r.langs||[],areas:r.areas||[],email:r.email,site:r.site}));
  renderReq();
}
async function sbLoad(){
  if(!SB||!SBU){SBST.reqs=[];SBST.docs=[];sbRender();return;}
  const pr=await SB.from('profiles').select('id,role,full_name');
  SBST.names={};(pr.data||[]).forEach(r=>{SBST.names[r.id]=r.full_name||'';if(r.id===SBU.id)SBROLE=r.role||'client';});
  const rq=await SB.from('requests').select('*').order('created_at',{ascending:false});
  const dc=await SB.from('documents').select('*').order('created_at',{ascending:false});
  SBST.reqs=rq.data||[];SBST.docs=dc.data||[];
  sbRender();
}
async function sbInit(){
  if(!SB_KEY){sbRender();return;}
  try{
    if(!window.supabase)await loadScript(SB_CDN);
    SB=window.supabase.createClient(SB_URL,SB_KEY);
    const {data}=await SB.auth.getSession();SBU=data.session?data.session.user:null;
    SB.auth.onAuthStateChange((ev,s)=>{const u=s?s.user:null;if((u&&u.id)!==(SBU&&SBU.id)){SBU=u;setTimeout(sbLoad,0);}});
    await sbAttorneys();await sbLoad();
  }catch(e){SBST.msg=t('sb_err');SBREADY=true;sbRender();}
}

     ${up?`<label class="chk" style="margin-top:10px"><input id="sb_consent" type="checkbox" ${SBST.consent?'checked':''}><span>${t('sb_consent')}</span></label>`:''}

     <p class="sm" style="margin-top:10px">${t('sb_note')}</p></div>`;

  const dl=d=>`<li style="margin-bottom:6px">${esc(d.name||'PDF')} <span class="mono sm">${d.size?Math.round(d.size/1024)+' KB':''}</span> <button class="btn ghost xs" data-a="sbdl" data-id="${esc(d.id)}">${t('sb_dl')}</button>${!isA||d.client_id===SBU.id?` <button class="btn ghost xs" data-a="sbdel" data-id="${esc(d.id)}">${t('sb_del')}</button>`:''}</li>`;
  const reqs=SBST.reqs.map(r=>{
    const docs=SBST.docs.filter(d=>d.request_id===r.id);
    const mine=r.client_id===SBU.id;
    const at=ATTORNEYS.find(a=>a.id===r.attorney_id);
    return `<div class="box" style="margin-top:12px"><p class="sm" style="margin:0 0 6px"><span class="mono">${esc(String(r.created_at||'').slice(0,10))}</span> · ${t('sb_stat')}: <b>${esc(r.status==='new'?t('sb_new'):r.status)}</b> · ${t('sb_att')}: ${at?esc(at.first+' '+at.last):t('sb_noat')}${!mine?` · ${t('sb_cl')}: ${esc(SBST.names[r.client_id]||'')}`:''}</p>

   <button class="btn" data-a="sbsave">${t('sb_save')}</button>

function sbRender(){const el=document.getElementById('p8body');if(el&&!(window.claude&&window.claude.use))el.innerHTML=sbHTML();}
const _renderLive0=renderLive;
renderLive=function(f){_renderLive0(f);sbRender();};
const gv=id=>{const e=document.getElementById(id);return e?e.value:'';};
app.addEventListener('change',e=>{if(e.target.id==='sb_consent')SBST.consent=e.target.checked;});
app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||!b.dataset.a.startsWith('sb'))return;
  const a=b.dataset.a;
  if(a==='sbmode'){SBST.email=gv('sb_email');SBST.name=gv('sb_name');SBST.mode=SBST.mode==='up'?'in':'up';SBST.msg='';sbRender();return;}
  if(!SB)return;
  try{
    if(a==='sbup'){
      SBST.email=gv('sb_email').trim();SBST.name=gv('sb_name').trim();const pw=gv('sb_pw');SBST.consent=!!(document.getElementById('sb_consent')||{}).checked;
      if(!SBST.consent){sbMsg(t('sb_consent_need'));return;}
      if(pw.length<8){sbMsg(t('sb_short'));return;}
      const {error}=await SB.auth.signUp({email:SBST.email,password:pw,options:{data:{full_name:SBST.name},emailRedirectTo:location.origin}});
      if(error){sbMsg(error.message);return;}
      SBST.mode='in';sbMsg(t('sb_conf'));
    }
    else if(a==='sbin'){
      SBST.email=gv('sb_email').trim();
      const {error}=await SB.auth.signInWithPassword({email:SBST.email,password:gv('sb_pw')});
      if(error){sbMsg(t('sb_bad'));return;}
      SBST.msg='';const g=await SB.auth.getSession();SBU=g.data.session?g.data.session.user:null;await sbLoad();
    }
    else if(a==='sbout'){await SB.auth.signOut();SBU=null;SBROLE='client';SBST.reqs=[];SBST.docs=[];SBST.msg='';sbRender();}
    else if(a==='sbsave'){
      SBST.consent=!!(document.getElementById('sb_consent')||{}).checked;
      if(!SBST.consent){sbMsg(t('sb_consent_need'));return;}
      if(!AR.out){sbMsg(t('sb_noreq'));return;}
      const row={topic:t(AR.topic),summary:AR.out,attorney_id:isUUID(AR.att)?AR.att:null};
      const {error}=await SB.from('requests').insert(row);
      if(error){sbMsg(error.message);return;}
      await sbLoad();sbMsg(t('sb_saved'));
    }
    else if(a==='sbupl'){
      SBST.consent=!!(document.getElementById('sb_consent')||{}).checked;
      if(!SBST.consent){sbMsg(t('sb_consent_need'));return;}
      const inp=document.getElementById('sbf_'+b.dataset.id),f=inp&&inp.files&&inp.files[0];if(!f)return;
      if(f.size>10*1024*1024){sbMsg(t('sb_big'));return;}
      const head=new TextDecoder().decode(new Uint8Array(await f.slice(0,5).arrayBuffer()));
      if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name))||head!=='%PDF-'){sbMsg(t('sb_pdf'));return;}
      const path=SBU.id+'/'+b.dataset.id+'/'+Date.now()+'.pdf';
      const up=await SB.storage.from('case-docs').upload(path,f,{contentType:'application/pdf',upsert:false});
      if(up.error){sbMsg(up.error.message);return;}
      const ins=await SB.from('documents').insert({request_id:b.dataset.id,path,name:f.name.slice(0,120),size:f.size});
      if(ins.error){await SB.storage.from('case-docs').remove([path]);sbMsg(ins.error.message);return;}
      await sbLoad();sbMsg(t('sb_upok'));
    }
    else if(a==='sbdl'){
      const d=SBST.docs.find(x=>x.id===b.dataset.id);if(!d)return;
      const {data,error}=await SB.storage.from('case-docs').createSignedUrl(d.path,60,{download:d.name||true});
      if(error||!data){sbMsg(t('sb_dlerr'));return;}
      const l=document.createElement('a');l.href=data.signedUrl;l.rel='noopener';document.body.appendChild(l);l.click();l.remove();
    }
    else if(a==='sbdel'){
      const d=SBST.docs.find(x=>x.id===b.dataset.id);if(!d)return;
      await SB.storage.from('case-docs').remove([d.path]);
      await SB.from('documents').delete().eq('id',d.id);
      await sbLoad();
    }
  }catch(err){sbMsg(t('sb_err'));}
});

  if(!v){v=await tryf('https://api.frankfurter.dev/v1/latest?from=USD&to=TRY',j=>j.rates&&j.rates.TRY);src='frankfurter.dev';}

  en:['Specialty occupation (H-1B)','For those who will work for a US employer sponsor in a job that requires a university degree (usually a bachelor’s or equivalent).','Sponsoring employer only',['The employer files the petition; you cannot apply alone. The job, your degree and your field must match.','There is an annual cap (65,000 general plus 20,000 for advanced degrees). The employer registers each March.','For the FY2027 selection, wage-level-weighted selection replaced the random lottery (DHS rule, effective 27 February 2026). A higher wage level improves the odds.','A September 2025 presidential proclamation set a $100,000 fee for new H-1B workers coming from abroad. Litigation is ongoing and the situation may change; check the current status with USCIS.','Usually granted for 3 years, up to 6 years in total with extensions. Your spouse and children get H-4.']]},
 {g:1,id:'l1',u:'https://www.uscis.gov/working-in-the-united-states',
  tr:['Şirket içi transfer (L-1)','Yurt dışındaki şirketinden ABD’deki bağlı, iştirak veya şube şirkete geçmek isteyenler.','Sadece transfer eden şirket',['Son 3 yılda yurt dışındaki şirkette en az 1 kesintisiz yıl çalışmış olmak gerekir.','L-1A yönetici ve müdürler içindir (en çok 7 yıl). L-1B özel bilgi sahipleri içindir (en çok 5 yıl).','ABD’de şirketle yurt dışındaki şirket arasında sahiplik bağı olmalı. Yeni ofis açılıyorsa ek şartlar vardır.','L-1 çalışanının eşi (L-2) çalışma izni alabilir. Bazı durumlarda yeşil karta (EB-1C) geçiş mümkündür.']],
  en:['Intra-company transfer (L-1)','For those moving from their company abroad to a US parent, affiliate, subsidiary or branch.','Transferring company only',['You must have worked at least 1 continuous year in the last 3 years at the company abroad.','L-1A is for executives and managers (up to 7 years). L-1B is for specialized knowledge (up to 5 years).','There must be an ownership link between the US company and the one abroad. Opening a new office adds conditions.','The spouse of an L-1 worker (L-2) can get work authorization. A path to a green card (EB-1C) exists in some cases.']]},
 {g:1,id:'o1',u:'https://www.uscis.gov/working-in-the-united-states/temporary-workers/o-1-visa-individuals-with-extraordinary-ability-or-achievement',
  tr:['Olağanüstü yetenek (O-1)','Bilim, eğitim, iş veya spor (O-1A), sanat ve film/televizyon (O-1B) alanlarında üst düzey başarısı olanlar.','Dilekçedeki işveren ve etkinlikler',['Alanında “sürekli ulusal veya uluslararası beğeni” göstermelisin. Nobel gibi büyük uluslararası bir ödül ya da listelenen kanıt türlerinden en az üçü (ödüller, üyelikler, basın, jüri üyeliği, özgün katkılar, yayınlar, kritik pozisyon, yüksek ücret) gerekir.','Kanıt sayısı tek başına yetmez; görevli tüm dosyayı bir bütün olarak değerlendirir.','Dilekçeyi ABD’li bir işveren veya ajans verir. Dilekçede olmayan işte çalışılamaz.']],
  en:['Extraordinary ability (O-1)','For people at the top of their field in science, education, business or athletics (O-1A) or in the arts and film/TV (O-1B).','Petitioner and listed engagements',['You must show “sustained national or international acclaim.” That means a major internationally recognized award such as a Nobel, or at least three of the listed evidence types (awards, memberships, press, judging, original contributions, scholarly articles, critical role, high pay).','Meeting the count is not enough; the officer weighs the whole record.','A US employer or agent files the petition. You cannot work outside what the petition lists.']]},
 {g:1,id:'e2',u:'https://travel.state.gov/content/visas/en/fees/treaty.html',
  tr:['Yatırımcı (E-2) ve ticaret (E-1)','Türkiye vatandaşlarının ABD’de işletme kurup yönetmesi (E-2) veya ağırlıklı olarak Türkiye ile ticaret yapması (E-1).','Yatırım yapılan işletme (eşin her işte çalışabilir)',['Türkiye, ABD Dışişleri’nin antlaşma listesinde hem E-1 (1933) hem E-2 (1990) için yer alıyor.','E-2’de “önemli miktarda” yatırım, gerçek ve faal bir işletme ve işletmenin en az yarısının Türk vatandaşlarına ait olması gerekir. İşletme sadece geçim sağlayacak kadar küçük (marjinal) olmamalı.','Yatırım yapan kişi yalnızca o işletmede çalışabilir. E-2 eşi ABD’de her işveren için çalışma izni alır.','Süre vize ve kalış olarak yenilenebilir; yatırım ve işletme devam ettiği sürece uzatılır.']],
  en:['Investor (E-2) and trade (E-1)','For Turkish nationals who set up and run a US business (E-2) or trade mainly with Türkiye (E-1).','The investment enterprise (spouse can work for any employer)',['Türkiye is on the US State Department treaty list for both E-1 (1933) and E-2 (1990).','E-2 needs a “substantial” investment, a real operating business and at least half ownership by Turkish nationals. The business cannot be so small that it only supports a living (marginal).','The investor may work only in that business. An E-2 spouse gets work authorization for any employer in the US.','Visa and stay can be renewed while the investment and business continue.']]},
 {g:2,id:'eb',u:'https://www.uscis.gov/working-in-the-united-states',
  tr:['Çalışma bazlı yeşil kart (EB-1, EB-2, EB-3)','ABD’de kalıcı olarak yaşamak ve çalışmak isteyenler.','Serbest (yeşil kart sonrası)',['EB-1A: olağanüstü yetenek, işveren sponsoru olmadan kendin başvurabilirsin. EB-1C: çok uluslu şirket yöneticileri.','EB-2: ileri derece veya olağanüstü yetenek. “Ulusal çıkar muafiyeti” (NIW) ile iş teklifi olmadan başvuru mümkündür.','EB-3: vasıflı işçi ve profesyoneller; genelde işveren sponsorluğu ve iş gücü sertifikasyonu (PERM) gerekir.','Kategoriye göre öncelik tarihine göre sıra beklenebilir. Güncel durum için Dışişleri’nin aylık Visa Bulletin’ine bak.']],
  en:['Employment-based green card (EB-1, EB-2, EB-3)','For those who want to live and work in the US permanently.','Unrestricted (after the green card)',['EB-1A: extraordinary ability, you can self-petition without an employer sponsor. EB-1C: multinational managers.','EB-2: advanced degree or exceptional ability. A national interest waiver (NIW) lets you apply without a job offer.','EB-3: skilled workers and professionals; usually needs employer sponsorship and labor certification (PERM).','Depending on the category you may wait for your priority date. Check the State Department’s monthly Visa Bulletin for the current situation.']]},
 {g:2,id:'eb5',u:'https://www.uscis.gov/working-in-the-united-states/options-for-alien-entrepreneurs-to-work-in-the-united-states',
  tr:['Yatırımcı yeşil kartı (EB-5)','Yüksek tutarlı yatırımla kalıcı oturum isteyenler.','Serbest (yeşil kart sonrası)',['Genel olarak yaklaşık 1.050.000 $, hedef istihdam bölgesi veya altyapı projesinde yaklaşık 800.000 $ yatırım ve en az 10 tam zamanlı ABD’li iş yaratmak gerekir. Tutarlar yasayla güncellenir; güncel rakamı USCIS’ten kontrol et.','Paranın yasal kaynağı ayrıntılı incelenir.','Bu yol pahalı ve karmaşıktır; mutlaka lisanslı bir göç avukatıyla ilerle.']],
  en:['Investor green card (EB-5)','For those who want permanent residence through a large investment.','Unrestricted (after the green card)',['Generally about $1,050,000, or about $800,000 in a targeted employment area or infrastructure project, plus creating at least 10 full-time US jobs. Amounts are adjusted by law; check the current figure with USCIS.','The lawful source of the funds is examined closely.','This route is expensive and complex; work with a licensed immigration attorney.']]},
 {g:2,id:'dv',u:'https://travel.state.gov/content/travel/en/us-visas/immigrate/diversity-visa-program-entry.html',
  tr:['DV (Yeşil Kart Piyangosu)','Her yıl yapılan, şansa bağlı kalıcı oturum programı.','Serbest (yeşil kart sonrası)',['Kayıt ücretsizdir (resmi Dışişleri sayfasında yazıyor). Para isteyen siteler dolandırıcıdır.','Kayıt dönemi, ülke uygunluğu ve eğitim/iş deneyimi şartı her yıl yayımlanan resmi DV talimatında yer alır. Türkiye vatandaşları için o yılın talimatını mutlaka kontrol et.','Seçilmek kesin sonuç değildir; seçilen herkes vize almaz ve kota dolabilir.']],
  en:['DV (Green Card Lottery)','A yearly, chance-based permanent residence program.','Unrestricted (after the green card)',['Registration is free (stated on the official State Department page). Sites that ask for money are scams.','The registration period, country eligibility and the education/work experience requirement are in the official DV instructions published each year. Check that year’s instructions for Turkish nationals.','Being selected is not a guarantee; not every selectee gets a visa and the quota can run out.']]},
 {g:2,id:'fam',u:'https://www.uscis.gov/family',
  tr:['Aile bazlı başvuru ve nişanlı vizesi (K-1)','ABD vatandaşı veya yeşil kartlı yakını olanlar.','Yeşil kart sonrası serbest',['ABD vatandaşının eşi, ebeveyni ve 21 yaş altı bekâr çocukları “yakın akraba” sayılır ve kota beklemez. Diğer akrabalarda öncelik sırası ve bekleme vardır.','Başvuruyu ABD’deki yakının yaptığı I-130 dilekçesi başlatır.','K-1 nişanlı vizesi: ABD vatandaşıyla nişanlıysan ABD’ye gelip 90 gün içinde evlenmen gerekir, sonra yeşil karta başvurulur.','Evliliğin gerçek olduğunu belgelemen gerekir; sahte evlilik ciddi sonuçlar doğurur.']],
  en:['Family-based petitions and the fiancé(e) visa (K-1)','For those with a US citizen or green-card-holder relative.','Unrestricted after the green card',['A US citizen’s spouse, parents and unmarried children under 21 are “immediate relatives” and do not wait for a quota. Other relatives have a priority order and waiting times.','The process starts with an I-130 petition filed by your relative in the US.','K-1 fiancé(e) visa: if you are engaged to a US citizen you must come to the US and marry within 90 days, then apply for a green card.','You must document that the marriage is genuine; sham marriages carry serious consequences.']]},
 {g:2,id:'asy',u:'https://www.uscis.gov/humanitarian/refugees-and-asylum/asylum',
  tr:['İltica (vize değil)','Zulüm görme korkusu nedeniyle ABD’de koruma isteyenler.','Başvuru sürecinde sınırlı; izin kuralları ayrıdır',['İltica bir vize türü değil, hukuki bir koruma başvurusudur ve kendi süre sınırları olabilir.','Sonuçları ağırdır. Mutlaka lisanslı bir göç avukatı veya yetkili bir hukuki yardım kuruluşuyla görüş.','Bu site iltica için başvuru yönlendirmesi veya hukuki tavsiye vermez.']],
  en:['Asylum (not a visa)','For those seeking protection in the US because they fear persecution.','Limited during the process; separate work rules apply',['Asylum is not a visa type but a request for legal protection and has its own deadlines.','The consequences are serious. Speak with a licensed immigration attorney or an authorized legal aid organization.','This site does not guide asylum applications or give legal advice.']]}
];

   <h3 class="grp">${t('vz_grp1')}</h3>${VISAS.filter(v=>v.g===1).map(card).join('')}

}

Object.assign(L.tr,{

function agSections(lg){
  const tr=lg!=='en';
  const dba='Bridge Border Consulting',co=cfg('company_name')+(tr?` (“${dba}” ticari adıyla faaliyet gösterir)`:` (doing business as “${dba}”)`),ad=cfg('company_address'),tx=cfg('company_taxno'),em=cfg('contact_email'),wa=cfg('contact_whatsapp');
  const coFull=co+(ad||tx?' ('+[ad,tx?'EIN: '+tx:''].filter(Boolean).join(', ')+')':'');
  const reach=[wa?'WhatsApp: '+wa:'',em?(tr?'E-posta: ':'Email: ')+em:''].filter(Boolean).join(' · ');
  if(tr)return [
   ['1. Taraflar',[`Bu sözleşme, ABD’de kurulu ${coFull} (“Şirket”) ile bu sözleşmeyi elektronik ortamda onaylayan kişi (“Danışan”) arasında kurulur. Şirket, Türkiye’deki işlemlerini yerel iş ortağı aracılığıyla yürütebilir; iş ortağının bilgileri ödeme sonrasında Danışan’a ayrıca bildirilir. Danışan, adını soyadını yazıp onay düğmesine basarak bu sözleşmeyi imzalamış sayılır.`]],
   ['2. Hizmetler',[
    '2.1 Ücretsiz ön görüşme: İlk görüşmenin ilk 10 dakikası ücretsizdir. Bu görüşmede Danışan’ın durumu dinlenir ve hangi hizmetin uygun olduğu söylenir.',
    '2.2 Danışmanlık paketi (100 USD): Görüşmenin 10 dakikayı aşması veya Danışan’ın vize başvurusu yapacak olması halinde danışmanlık ücreti alınır. Paket; kişiye özel danışmanlık ve yönlendirme görüşmelerini, gerektiğinde avukat görüşmesinin ayarlanmasını (örneğin statü değişikliği veya USCIS dosya hazırlığı), süre ve tarih hatırlatmalarını ve sitedeki güvenli talep ve belge alanını kapsar. Danışmanlık ücreti en fazla iki (2) vize başvurusunu kapsar.',
    '2.3 DS-160 ve mülakat hazırlığı (250 USD): Danışmanlık ücretine ek, ayrı bir hizmettir ve her vize başvurusu için ayrıca alınır. DS-160 formunun Danışan’ın verdiği bilgilerle doldurulmasını ve mülakat hazırlığını kapsar. İlk başvuruda vize alınamaz ve Danışan yeniden başvurmak isterse 250 USD yeniden ödenir. İlk başvuru için toplam ücret 350 USD’dir.',
    '2.4 Başvuru hakları: (a) 1. ve 2. başvuru danışmanlık ücreti kapsamındadır; her başvuru için 250 USD ayrıca ödenir. (b) İkinci başvuruda vize alınamazsa ve Danışan Şirket’le devam etmek isterse, 3. başvuru için 100 USD yeni danışmanlık ücreti ve 250 USD başvuru ücreti alınır. (c) 4. başvuru ve sonrası Şirket üzerinden yürütülmez.']],
   ['3. Kapsam dışındakiler',[
    '3.1 Şirket bir hukuk bürosu değildir. Hukuki tavsiye vermez ve Danışan’ı konsolosluk, USCIS veya mahkeme önünde temsil etmez. Hukuki görüş ve temsil, Danışan’ın seçtiği lisanslı avukat tarafından verilir.',
    '3.2 Avukat ücretleri bu sözleşmeye dahil değildir. Avukatın danışmanlık ve hizmet ücreti farklıdır, seçilen avukata göre değişir ve avukatla ayrıca anlaşılır.',
    '3.3 Konsolosluk vize harcı, USCIS resmi başvuru ücretleri, SEVIS ücreti, tercüme, noter, diploma değerlendirme ve benzeri üçüncü kişi ücretleri dahil değildir.',
    '3.4 Şirket iş bulma veya işe yerleştirme hizmeti vermez.']],
   ['4. Garanti yoktur',['Vize, statü veya iş onayı kararını yalnızca ABD konsoloslukları, USCIS ve ilgili makamlar verir. Şirket hiçbir sonucu garanti etmez. Ret kararı, ödenen ücretlerin iadesi sebebi değildir. Sitedeki skorlar hazırlık göstergesidir, onay olasılığı değildir.']],
   ['5. Danışan’ın sorumlulukları',[
    '5.1 Danışan, verdiği tüm bilgi ve belgelerin doğru, eksiksiz ve güncel olmasından sorumludur. Yanlış veya eksik bilgi vize reddine ve ileride ciddi sonuçlara yol açabilir.',
    '5.2 DS-160 formunu gönderilmeden önce Danışan kendisi kontrol eder ve kendisi elektronik olarak imzalar. Formdaki beyanlardan Danışan sorumludur.',
    '5.3 Hatırlatmalar destek amaçlıdır. Vize, I-94, statü ve başvuru sürelerinin takibi nihai olarak Danışan’ın sorumluluğundadır.']],
   ['6. Ücret ve ödeme',[
    '6.1 Ücretler ABD doları olarak belirlenir. Ödeme, sitede gösterilen kurla hesaplanan Türk lirası karşılığı olarak Şirket’in bildirdiği IBAN hesabına havale ile yapılır. IBAN bilgisi sitede veya WhatsApp üzerinden bildirilir. Havale açıklamasına sitede gösterilen referans kodu yazılır.',
    '6.2 Hizmet, ödemenin Şirket tarafından onaylanmasıyla başlar. DS-160 ve mülakat hazırlığı hizmeti, danışmanlık ücreti onaylandıktan sonra satın alınabilir.']],
   ['7. İptal ve iade',[
    '7.1 Danışan hizmet başlamadan önce iptal ederse ödediği ücret iade edilir.',
    '7.2 Danışan’ın onayıyla hizmetin ifasına başlandıktan sonra (ilk ücretli görüşme yapıldıktan veya DS-160 çalışmasına başlandıktan sonra) Danışan, Mesafeli Sözleşmeler Yönetmeliği uyarınca cayma hakkını kullanamaz ve ilgili hizmet bedeli iade edilmez.',
    '7.3 Vize reddi iade sebebi değildir. 4. başvuru ve sonrasında Şirket hizmet vermez ve daha önce ödenen ücretler iade edilmez.']],
   ['8. Kişisel veriler',[`Şirket, Danışan’ın paylaştığı kişisel verileri 6698 sayılı KVKK kapsamında yalnızca bu hizmetin verilmesi, iletişim ve yasal yükümlülükler için işler. Veriler, hizmet sağlayıcının yurt dışında bulunabilen sunucularında saklanır. Belgeler yalnızca Danışan’ın talebiyle ve Danışan’ın seçtiği avukatla paylaşılır. Danışan, KVKK’daki haklarını Şirket’e yazarak kullanabilir (${reach}).`]],
   ['9. İletişim',[`Şirket, Danışan’la e-posta, telefon veya WhatsApp üzerinden iletişim kurar. ${reach}.`]],
   ['10. Uyuşmazlıklar',['Uyuşmazlıklarda taraflar önce WhatsApp veya e-posta üzerinden çözüm arar. Danışan’ın tüketici olarak, yerleşim yerindeki tüketici hakem heyetine veya tüketici mahkemesine başvurma hakkı saklıdır.']],
   ['11. Yürürlük',[`Danışan, onay kutularını işaretleyip adını soyadını yazarak ve “Onayla ve imzala” düğmesine basarak bu sözleşmeyi okuduğunu, anladığını ve kabul ettiğini beyan eder. Onay tarihi, saati ve sözleşme sürümü (${AG_VER}) kayıt altına alınır.`]]
  ];
  return [
   ['1. Parties',[`This agreement is made between ${coFull}, a company established in the US (the “Company”), and the person who accepts it electronically (the “Client”). The Company may carry out its work in Türkiye through a local business partner; the partner’s details are shared with the Client separately after payment. By typing their full name and pressing the accept button, the Client is deemed to have signed this agreement.`]],
   ['2. Services',[
    '2.1 Free first call: The first 10 minutes of the first call are free. The Company listens to the Client’s situation and says which service fits.',
    '2.2 Consulting package (100 USD): The consulting fee applies if the call goes beyond 10 minutes or the Client will apply for a visa. The package covers personal consulting and guidance calls, arranging an attorney meeting when needed (for example a change of status or USCIS file preparation), deadline and date reminders, and the secure request and document area on the site. The consulting fee covers at most two (2) visa applications.',
    '2.3 DS-160 and interview preparation (250 USD): A separate service on top of the consulting fee, charged for each visa application. It covers completing the DS-160 form with the information the Client provides and interview preparation. If the first application is refused and the Client wants to apply again, the 250 USD is due again. The total for the first application is 350 USD.',
    '2.4 Application rights: (a) The 1st and 2nd applications are covered by the consulting fee; 250 USD is paid separately for each. (b) If the second application is refused and the Client wants to continue with the Company, a new 100 USD consulting fee and the 250 USD application fee apply to the 3rd application. (c) The 4th application and later are not handled by the Company.']],
   ['3. Not included',[
    '3.1 The Company is not a law firm. It does not give legal advice and does not represent the Client before a consulate, USCIS or a court. Legal advice and representation are provided by the licensed attorney the Client chooses.',
    '3.2 Attorney fees are not included. The attorney’s consultation and service fees are separate, vary by attorney and are agreed with the attorney directly.',
    '3.3 Consular visa fees, official USCIS filing fees, the SEVIS fee, translation, notary, credential evaluation and similar third-party fees are not included.',
    '3.4 The Company does not provide job search or job placement.']],
   ['4. No guarantee',['Only US consulates, USCIS and the relevant authorities decide on visas, status and work approval. The Company guarantees no outcome. A refusal is not a reason to refund fees paid. Scores on the site are readiness indicators, not approval odds.']],
   ['5. Client responsibilities',[
    '5.1 The Client is responsible for all information and documents being accurate, complete and current. Wrong or missing information can lead to a refusal and serious later consequences.',
    '5.2 Before the DS-160 is submitted, the Client reviews it and signs it electronically themselves. The Client is responsible for the statements in the form.',
    '5.3 Reminders are a support service. Tracking visa, I-94, status and filing deadlines remains the Client’s responsibility.']],
   ['6. Fees and payment',[
    '6.1 Fees are set in US dollars. Payment is made by bank transfer, in Turkish lira calculated at the rate shown on the site, to the IBAN the Company provides on the site or over WhatsApp. The reference code shown on the site is written in the transfer description.',
    '6.2 The service starts once the Company confirms the payment. The DS-160 and interview preparation service can be bought after the consulting fee is confirmed.']],
   ['7. Cancellation and refunds',[
    '7.1 If the Client cancels before the service starts, the fee paid is refunded.',
    '7.2 Once performance has started with the Client’s consent (after the first paid call or once DS-160 work has begun), the Client cannot use the right of withdrawal under the Turkish Distance Contracts Regulation and the fee for that service is not refunded.',
    '7.3 A visa refusal is not a reason for a refund. From the 4th application on, the Company provides no service and fees paid earlier are not refunded.']],
   ['8. Personal data',[`The Company processes the personal data the Client shares under Turkish data protection law (KVKK No. 6698) only to provide this service, to communicate and to meet legal obligations. Data is stored on the service provider’s servers, which may be located abroad. Documents are shared only at the Client’s request and only with the attorney the Client chooses. The Client can exercise their rights by writing to the Company (${reach}).`]],
   ['9. Contact',[`The Company contacts the Client by email, phone or WhatsApp. ${reach}.`]],
   ['10. Disputes',['In a dispute the parties first seek a solution over WhatsApp or email. The Client’s right as a consumer to apply to the consumer arbitration committee or consumer court where they live is reserved.']],
   ['11. Effect',[`By ticking the consent boxes, typing their full name and pressing “Accept and sign”, the Client declares that they have read, understood and accepted this agreement. The date, time and agreement version (${AG_VER}) are recorded.`]]
  ];

app.addEventListener('click',async e=>{

    const txt=agPlain(lang);
    const {error}=await SB.from('agreements').insert({version:AG_VER,full_name:nm,lang,text_sha256:await sha256(txt),user_agent:navigator.userAgent.slice(0,200),consent_terms:true,consent_data:true});

payHTML=function(kind,ref,n){
  kind=kind==='visa'?'visa':'consult';ref=ref||payRef(kind);n=n||1;
  const c=SBCFG||{};
  const last=(SBST.pay||[]).filter(x=>x.reference===ref)[0];
  const st=last?(last.status==='pending'?`<span class="chip wait">${t('pay_pending')}</span>`:last.status==='rejected'?`<span class="chip bad">${t('pay_rej')}</span>`:`<span class="chip ok">${t('pay_ok')}</span>`):'';
  const row=(k,v,cp)=>v?`<tr><td>${t(k)}</td><td><b class="mono" style="overflow-wrap:anywhere">${esc(v)}</b>${cp?` <button class="btn ghost xs" data-a="sbcopy" data-v="${esc(v)}">${t('pay_copy')}</button>`:''}</td></tr>`:'';
  const intro=kind==='visa'?t('pay_scope_v'):t('pay_scope');
  const title=`<h4>${t(kind==='visa'?'pay_hv':'pay_h')}${n>1?` · ${n}. ${t('vf_n')}`:''}</h4>`;
  const f=feeCalc(kind);
  if(!f){
    if(!RATE.busy&&!RATE.err)fetchRate();
    return `${title}<p class="cap">${intro}</p><p class="sm">${RATE.err?t('rate_err'):t('rate_load')}</p><button class="btn ghost xs" data-a="raterefresh">${t('rate_retry')}</button>`;
  }
  const iban=c.pay_iban&&/\d{4}/.test(c.pay_iban)?c.pay_iban:'';
  const wa=waNum();
  const waBtn=wa?`<a class="btn ghost xs" href="https://wa.me/${wa}?text=${encodeURIComponent(t('pay_wamsg').replace('{ref}',ref).replace('{amt}',fmtTL(f.tl)))}" target="_blank" rel="noopener noreferrer">${t('pay_wa')}</a>`:'';
  const pending=last&&last.status==='pending',done=last&&last.status==='confirmed';
  const rn=f.ov?t('rate_fixed'):`${t('rate_src')} ${esc(RATE.src)}${RATE.ts?`, ${esc(RATE.ts)}`:''}`;
  const ibanRows=iban?`${row('pay_iban',iban,1)}${row('pay_hold',c.pay_holder)}${row('pay_bank',c.pay_bank)}`:`<tr><td>${t('pay_iban_l')}</td><td>${t('pay_viawa')} ${waBtn}</td></tr>`;
  return `${title}<p class="cap">${intro}</p><div class="tabw"><table><tbody>
    <tr><td>${t('pay_amt')}</td><td><b>${fmtTL(f.tl)} <span class="sm">(${f.usd} USD)</span></b></td></tr>
    <tr><td>${t('rate_l')}</td><td><span class="mono">1 USD = ${f.rate} TL</span></td></tr>
    ${ibanRows}${row('pay_ref',ref,1)}</tbody></table></div>
   <p class="sm" style="margin-top:8px">${rn}</p><p class="sm">${iban?t('pay_i'):t('pay_i_wa')}</p><p class="sm">${t('rate_note')}</p>
   ${pending||done?'':`<label class="fld" for="sb_sender_${kind}" style="max-width:360px"><span>${t('pay_sender')}</span><input id="sb_sender_${kind}" type="text" maxlength="80"></label>`}
   <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px">${pending||done?'':`<button class="btn" data-a="sbpaid" data-k="${kind}" data-ref="${esc(ref)}" data-n="${n}">${t('pay_btn')}</button>`}<button class="btn ghost" data-a="sbrefresh">${t('pay_ref2')}</button><button class="btn ghost xs" data-a="raterefresh">${t('rate_retry')}</button>${st}</div>`;
};
visaCardHTML=function(){
  const P=SBST.pay||[],conf=P.filter(x=>x.status==='confirmed');
  const vDone=conf.filter(x=>x.kind==='visa').length,cDone=conf.filter(x=>(x.kind||'consult')==='consult').length;
  const n=vDone+1,base=payRef('consult');
  let body;
  if(n>=4)body=`<p class="cap">${t('vf_max')}</p>`;
  else{
    const needC=n===3&&cDone<2;
    const vref=base+'-V'+n,cref=base+'-C3';
    const inner=needC?`<p class="sm">${t('vf_c3')}</p>${payHTML('consult',cref,3)}`:payHTML('visa',vref,n);
    const head=vDone?`<p class="sm"><span class="chip ok">${t('pay_ok')}</span> ${t('vf_done').replace('{n}',vDone)}</p>`:'';
    const pend=P.some(x=>x.status!=='confirmed'&&(x.reference===vref||x.reference===cref));
    body=`${head}<details ${pend?'open':''}><summary><b>${vDone?t('vf_again').replace('{n}',n):t('vf_open')}</b></summary>${inner}</details>`;
  }
  return `<div class="box" style="margin-top:12px"><h3>${t('vf_h')}</h3><p class="sm" style="margin:6px 0">${t('vf_i')}</p>${body}</div>`;
};

function getPos(){return new Promise(res=>{
  if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
});}
document.addEventListener('input',e=>{
  const m={sf_name:'name',sf_cn:'cn',sf_cp:'cp',sf_ce:'ce',sf_note:'note'}[e.target.id];if(m)SAFE[m]=e.target.value;
});
document.addEventListener('change',e=>{if(e.target.id==='sf_c1')SAFE.c1=e.target.checked;});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-sa]');if(!b)return;
  const a=b.dataset.sa;
  if(a==='open'){SAFE.msg='';go('guvenlik');}
  else if(a==='close'){go('home');}
  else if(a==='auth'){SBST.mode='up';SBST.msg='';go('danismanlik');renderGate();}
  else if(a==='copy'){copyText(b.dataset.v,()=>toast(t('copied')));}
  else if(a==='accept'){
    const nm=SAFE.name.trim();
    if(!SAFE.c1||nm.length<3){SAFE.msg=t('ag_need');safeRender();return;}
    const txt=t('sf_terms').join('\n')+'\n'+t('sf_c1');
    const {error}=await SB.from('agreements').insert({version:'safe-v1',full_name:nm,lang,text_sha256:await sha256(txt),user_agent:navigator.userAgent.slice(0,200),consent_terms:true,consent_data:true});
    if(error){SAFE.msg=error.message;safeRender();return;}
    SAFE.msg='';await sbLoad();
  }
  else if(a==='addc'){
    const nm=SAFE.cn.trim(),ph=normPhone(SAFE.cp),em=SAFE.ce.trim();
    if(nm.length<2||(!ph&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))||(SAFE.cp.trim()&&!ph)){SAFE.msg=t('sf_badc');safeRender();return;}
    const {error}=await SB.from('safe_contacts').insert({name:nm,phone:ph||null,email:/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)?em:null});
    if(error){SAFE.msg=error.message;safeRender();return;}
    SAFE.cn=SAFE.cp=SAFE.ce='';SAFE.msg='';await sbLoad();
  }
  else if(a==='delc'){await SB.from('safe_contacts').delete().eq('id',b.dataset.id);await sbLoad();}
  else if(a==='sos'){
    if(!SBST.agSafe){SAFE.msg=t('sf_need_t');safeRender();return;}
    if(!(SBST.sc||[]).length){SAFE.msg=t('sf_need_c');safeRender();return;}
    SAFE.busy=true;SAFE.msg='';safeRender();
    const pos=await getPos();
    const row={note:SAFE.note.trim()||null};if(pos){row.lat=pos.lat;row.lng=pos.lng;row.accuracy=pos.acc;}
    const r=await SB.from('safe_alerts').insert(row).select().single();
    SAFE.busy=false;
    if(r.error){SAFE.msg=r.error.message;safeRender();return;}
    let msg=t('sf_sent');if(!pos)msg=t('sf_noloc')+' '+msg;
    try{
      if(SB.functions){const f=await SB.functions.invoke('send-alert',{body:{alert_id:r.data.id,lang}});
        if(f&&!f.error&&f.data&&typeof f.data.sent==='number'&&f.data.sent>0)msg+=' '+t('sf_mail_ok')+' '+f.data.sent+'.';else msg+=' '+t('sf_mail_no');}
      else msg+=' '+t('sf_mail_no');
    }catch(err){msg+=' '+t('sf_mail_no');}
    SAFE.msg=msg;SAFE.note='';await sbLoad();
  }
  else if(a==='upd'){
    const pos=await getPos();if(!pos){SAFE.msg=t('sf_noloc');safeRender();return;}
    const {error}=await SB.from('safe_alerts').update({lat:pos.lat,lng:pos.lng,accuracy:pos.acc,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);
    SAFE.msg=error?error.message:t('sf_updated');await sbLoad();
  }
  else if(a==='clr'){await SB.from('safe_alerts').delete().eq('id',b.dataset.id);SAFE.msg=t('sf_cleared');await sbLoad();}
});

const ROUTES=['home','vizeler','rota','danismanlik','guvenlik'];
let ROUTE='home';
const routeFromHash=()=>{const h=(location.hash||'').replace(/^#\/?/,'');return ROUTES.includes(h)?h:'home';};
const NAVL={home:'nv_home',vizeler:'nv_viz',rota:'nv_rota',danismanlik:'nv_dan',guvenlik:'nv_guv'};
function applyRoute(noScroll){
  ROUTE=routeFromHash();
  document.body.dataset.pg=ROUTE;
  document.querySelectorAll('#pnav [data-route]').forEach(b=>{if(b.dataset.route===ROUTE)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  try{document.title='ABD Rotası'+(ROUTE==='home'?'':' · '+t(NAVL[ROUTE]));}catch(e){}
  if(ROUTE==='guvenlik'){safeRender();if(SB&&SBU)sbLoad();}
  if(!noScroll)window.scrollTo({top:0});
}
function go(r,noScroll){
  if(!ROUTES.includes(r))r='home';
  const target=r==='home'?'#/':'#/'+r;
  if(location.hash!==target)history.pushState(null,'',target);
  applyRoute(noScroll);
}
window.addEventListener('popstate',()=>{if(routeFromHash()!==ROUTE)applyRoute();});
window.addEventListener('hashchange',()=>{if(routeFromHash()!==ROUTE)applyRoute();});

function homeHTML(){
  const wa=cfg('contact_whatsapp').replace(/\D/g,'');
  const waB=wa?`<a class="btn ghost" href="https://wa.me/${wa}?text=${encodeURIComponent(t('pk_wamsg'))}" target="_blank" rel="noopener noreferrer">${t('hm_wa')}</a>`:'';
  const card=(h,p,b,r)=>`<div class="box"><h3 style="margin:0">${h}</h3><p class="sm" style="margin:0">${p}</p><button class="btn ghost" data-route="${r}">${b}</button></div>`;
  return `<section class="box hfeat" style="margin:0 0 20px"><h2>${t('hm_c_h')}</h2><p style="margin:0 0 8px">${t('hm_c_p')}</p>
    <ul class="tight" style="margin:0 0 12px">${(aptOn()?t('hm_c_l'):[t('hm_c_l')[0],t('hm_c_hide')]).map(x=>`<li>${x}</li>`).join('')}</ul>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-route="danismanlik">${aptOn()?t('hm_c_b'):t('apt_b')}</button>${waB}</div></section>
   <h2 style="margin:0">${t('hm_g')}</h2>
